<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo/logo.png" />
  <title>Orders — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A84C; --gold-light: #E8C96A; --gold-dim: #8B6914;
      --black: #0A0A0A; --black-2: #111111; --black-3: #1A1A1A; --black-4: #222222;
      --white: #F5F5F0; --white-dim: #AAAAAA;
      --font-display: 'Playfair Display', serif; --font-body: 'Poppins', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--black); color: var(--white); font-family: var(--font-body); font-weight: 300; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }
    header { background: var(--black-2); border-bottom: 1px solid rgba(201,168,76,0.12); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .header-title { font-family: var(--font-display); font-size: 16px; color: var(--gold); }
    .back-link { color: var(--white-dim); text-decoration: none; font-size: 13px; }
    .back-link:hover { color: var(--gold); }
    .page { max-width: 800px; margin: 0 auto; padding: 20px 16px 80px; }
    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat { background: var(--black-3); border: 1px solid rgba(201,168,76,0.08); border-radius: 8px; padding: 14px 16px; }
    .stat-val { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--gold); }
    .stat-lbl { font-size: 10px; color: var(--white-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 3px; }
    /* Filters */
    .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-btn { padding: 8px 16px; border: 1px solid rgba(201,168,76,0.15); background: transparent; color: var(--white-dim); border-radius: 20px; font-size: 12px; cursor: pointer; font-family: var(--font-body); transition: all 0.2s; }
    .filter-btn.active { background: var(--gold); color: var(--black); border-color: var(--gold); font-weight: 600; }
    .search-input { width: 100%; background: var(--black-3); border: 1px solid rgba(201,168,76,0.15); color: var(--white); padding: 10px 14px; border-radius: 4px; font-size: 13px; font-family: var(--font-body); margin-bottom: 16px; }
    .search-input:focus { outline: none; border-color: var(--gold); }
    .search-input::placeholder { color: var(--white-dim); }
    /* Order cards */
    .order-card { background: var(--black-3); border: 1px solid rgba(201,168,76,0.08); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
    .order-header { display: flex; align-items: center; gap: 10px; padding: 13px 14px; cursor: pointer; }
    .order-header:active { background: var(--black-4); }
    .order-info { flex: 1; min-width: 0; }
    .order-name { font-size: 14px; font-weight: 500; color: var(--white); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .order-meta { font-size: 11px; color: var(--white-dim); }
    .order-right { text-align: right; flex-shrink: 0; }
    .order-amount { font-size: 15px; font-weight: 600; color: var(--gold); }
    .order-time { font-size: 10px; color: var(--white-dim); margin-top: 2px; }
    .badge { font-size: 10px; padding: 2px 8px; border-radius: 3px; font-weight: 500; display: inline-block; }
    .badge-paid { background: rgba(37,211,102,0.1); color: #25D366; }
    .badge-unpaid { background: rgba(249,115,22,0.1); color: #f97316; }
    .badge-delivered { background: rgba(59,130,246,0.1); color: #60a5fa; }
    .badge-pending { background: rgba(156,163,175,0.1); color: #9ca3af; }
    .order-body { display: none; padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.04); background: var(--black-4); }
    .order-body.open { display: block; }
    .detail-row { font-size: 13px; color: var(--white-dim); margin-bottom: 6px; }
    .detail-row strong { color: var(--white); }
    .items-box { background: var(--black-3); border-radius: 6px; padding: 10px 12px; margin: 10px 0; font-size: 12px; color: var(--white-dim); line-height: 1.8; }
    .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .btn-action { padding: 9px 14px; border: none; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: var(--font-body); transition: opacity 0.2s; }
    .btn-action:hover { opacity: 0.85; }
    .btn-paid { background: rgba(37,211,102,0.12); color: #25D366; }
    .btn-delivered { background: rgba(59,130,246,0.12); color: #60a5fa; }
    .btn-delete { background: rgba(239,68,68,0.1); color: #ef4444; }
    .empty { text-align: center; padding: 50px 20px; color: var(--white-dim); }
    .empty-icon { font-size: 36px; margin-bottom: 12px; display: block; }
    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: var(--black-3); border: 1px solid rgba(239,68,68,0.2); border-radius: 12px; max-width: 320px; width: 100%; padding: 26px 22px; text-align: center; }
    .modal-box h3 { font-family: var(--font-display); font-size: 17px; color: var(--white); margin-bottom: 8px; }
    .modal-box p { font-size: 13px; color: var(--white-dim); margin-bottom: 20px; }
    .modal-btns { display: flex; gap: 10px; justify-content: center; }
    .btn-confirm { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font-body); }
    .btn-cancel { background: var(--black-4); color: var(--white-dim); border: 1px solid rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 4px; font-size: 13px; cursor: pointer; font-family: var(--font-body); }
  </style>
</head>
<body>
  <header>
    <div class="header-title">🧾 Orders</div>
    <a href="admin_home.html" class="back-link">← Dashboard</a>
  </header>
  <div class="page">
    <div class="stats">
      <div class="stat"><div class="stat-val" id="statTotal">—</div><div class="stat-lbl">Total Orders</div></div>
      <div class="stat"><div class="stat-val" id="statRevenue" style="font-size:18px;">—</div><div class="stat-lbl">Total Revenue</div></div>
      <div class="stat"><div class="stat-val" id="statPaid" style="color:#25D366;">—</div><div class="stat-lbl">Paid</div></div>
      <div class="stat"><div class="stat-val" id="statDelivered" style="color:#60a5fa;">—</div><div class="stat-lbl">Delivered</div></div>
    </div>
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" onclick="setFilter('unpaid', this)">Unpaid</button>
      <button class="filter-btn" onclick="setFilter('paid', this)">Paid</button>
      <button class="filter-btn" onclick="setFilter('delivered', this)">Delivered</button>
    </div>
    <input class="search-input" type="text" id="searchInput" placeholder="🔍 Search by name or phone..." oninput="renderOrders()" />
    <div id="orderList"><div class="empty"><span class="empty-icon">🧾</span>Loading orders...</div></div>
  </div>

  <div class="modal-overlay" id="deleteModal">
    <div class="modal-box">
      <h3>Delete Order?</h3>
      <p>This cannot be undone.</p>
      <div class="modal-btns">
        <button class="btn-confirm" onclick="confirmDelete()">Delete</button>
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const baseUrl = "https://sman-phones-1.onrender.com/api";
    const token = localStorage.getItem("token");

    if (!token) {
      alert("Access denied. Please log in.");
      window.location.href = "admin_login.html";
    }

    let allOrders = [];
    let currentFilter = 'all';
    let deleteId = null;

    function timeAgo(d) {
      const s = Math.floor((new Date() - new Date(d)) / 1000);
      if (s < 60) return 'Just now';
      if (s < 3600) return Math.floor(s/60) + 'm ago';
      if (s < 86400) return Math.floor(s/3600) + 'h ago';
      return Math.floor(s/86400) + 'd ago';
    }

    function setFilter(f, btn) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderOrders();
    }

    function toggle(id) { document.getElementById('body-' + id).classList.toggle('open'); }
    function renderOrders() {
      const kw = document.getElementById('searchInput').value.toLowerCase();
      let filtered = allOrders.filter(o => {
        // Convert status safely to a lowercase string for comparison
        const paymentStatus = String(o.payment_status).toLowerCase();

        // 🔄 FIXED: Checks against lowercase values safely
        if (currentFilter === 'paid' && paymentStatus !== 'paid') return false;
        if (currentFilter === 'unpaid' && paymentStatus === 'paid') return false;
        
        if (currentFilter === 'delivered' && o.status !== 'Delivered') return false;
        if (kw && !o.customer_name.toLowerCase().includes(kw) && !o.customer_phone.includes(kw)) return false;
        return true;
      });

      const list = document.getElementById('orderList');
      if (filtered.length === 0) { list.innerHTML = '<div class="empty"><span class="empty-icon">🧾</span><p>No orders found.</p></div>'; return; }

      list.innerHTML = filtered.map(o => {
        let items = '';
        try { items = JSON.parse(o.items).map(i => `${i.name} × ${i.quantity} — ₦${(i.price * i.quantity).toLocaleString()}`).join('<br>'); }
        catch { items = o.item_names; }
        return `
        <div class="order-card">
          <div class="order-header" onclick="toggle(${o.id})">
            <div class="order-info">
              <div class="order-name">${o.customer_name}</div>
              <div class="order-meta">#${o.order_id} · ${o.customer_phone}</div>
            </div>
            <div class="order-right">
              <div class="order-amount">₦${Number(o.total).toLocaleString()}</div>
              <div class="order-time">${timeAgo(o.timestamp)}</div>
            </div>
          </div>
          <div class="order-body" id="body-${o.id}">
            <div class="detail-row"><strong>Email:</strong> ${o.customer_email || 'N/A'}</div>
            <div class="detail-row"><strong>Address:</strong> ${o.customer_address || 'N/A'}</div>
            <div class="detail-row"><strong>Reference:</strong> ${o.payment_reference || 'N/A'}</div>
            <div class="detail-row">
              <span class="badge ${o.payment_status === 'Paid' ? 'badge-paid' : 'badge-unpaid'}">${o.payment_status}</span>
              &nbsp;
              <span class="badge ${o.status === 'Delivered' ? 'badge-delivered' : 'badge-pending'}">${o.status}</span>
            </div>
            <div class="items-box">${items}</div>
            <div class="action-row">
              ${o.payment_status !== 'Paid' ? `<button class="btn-action btn-paid" onclick="markPaid(${o.id})">✅ Mark Paid</button>` : ''}
              ${o.status !== 'Delivered' ? `<button class="btn-action btn-delivered" onclick="markDelivered(${o.id})">🚚 Mark Delivered</button>` : ''}
              <button class="btn-action btn-delete" onclick="openModal(${o.id})">🗑️ Delete</button>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    async function markPaid(id) {
      try {
        const res = await fetch(`${baseUrl}/orders/${id}/mark_paid`, { method: 'PUT', headers: { Authorization: `Bearer ${token}` } });
        if (res.ok) loadOrders(); else alert('Failed to mark paid.');
      } catch { alert('Network error.'); }
    }

    async function markDelivered(id) {
      try {
        const res = await fetch(`${baseUrl}/orders/${id}/mark_delivered`, { method: 'PUT', headers: { Authorization: `Bearer ${token}` } });
        if (res.ok) loadOrders(); else alert('Failed to mark delivered.');
      } catch { alert('Network error.'); }
    }

    function openModal(id) { deleteId = id; document.getElementById('deleteModal').classList.add('active'); }
    function closeModal() { deleteId = null; document.getElementById('deleteModal').classList.remove('active'); }

    async function confirmDelete() {
      try {
        const res = await fetch(`${baseUrl}/orders/${deleteId}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
        if (res.ok) loadOrders(); else alert('Failed to delete.');
      } catch { alert('Network error.'); }
      closeModal();
    }

    async function loadOrders() {
      try {
        const res = await fetch(`${baseUrl}/orders`, { headers: { Authorization: `Bearer ${token}` } });
        if (res.status === 401) { window.location.href = 'admin_login.html'; return; }
        allOrders = res.ok ? await res.json() : [];
        // Stats
        document.getElementById('statTotal').textContent = allOrders.length;
        const paid = allOrders.filter(o => o.payment_status === 'Paid');
        document.getElementById('statPaid').textContent = paid.length;
        document.getElementById('statDelivered').textContent = allOrders.filter(o => o.status === 'Delivered').length;
        document.getElementById('statRevenue').textContent = '₦' + paid.reduce((s, o) => s + o.total, 0).toLocaleString();
        renderOrders();
      } catch { document.getElementById('orderList').innerHTML = '<div class="empty"><span class="empty-icon">⚠️</span><p>Failed to load orders.</p></div>'; }
    }
    loadOrders();

// 🔄 ADD THIS LINE: Automatically refresh all order rows and stats every 10 seconds
setInterval(loadOrders, 10000);

  </script>
</body>
</html>
