<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo/s%20and%20s%20collection%20logo.png" />
  <title>Admin Orders - S&S Collection</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
    }

    header {
      background: #333;
      color: white;
      padding: 16px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    header h1 { font-size: 20px; }

    .controls {
      background: white;
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      position: sticky;
      top: 56px;
      z-index: 99;
    }

    .filter-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .filter-btn:hover { opacity: 0.85; }
    .filter-btn.all { background: #6b7280; color: white; }
    .filter-btn.pending { background: #f97316; color: white; }
    .filter-btn.paid { background: #10b981; color: white; }
    .filter-btn.delivered { background: #3b82f6; color: white; }

    #searchPhone {
      padding: 8px 14px;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 13px;
      width: 200px;
      margin-left: auto;
    }

    .container { padding: 16px; }

    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .stat-card {
      background: white;
      border-radius: 10px;
      padding: 14px 20px;
      flex: 1;
      min-width: 120px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      text-align: center;
    }

    .stat-card .stat-value {
      font-size: 22px;
      font-weight: bold;
      color: #111;
    }

    .stat-card .stat-label {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    /* Orders list */
    .order-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 12px;
      overflow: hidden;
      transition: box-shadow 0.2s;
    }

    .order-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.1); }

    .order-header {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      cursor: pointer;
      gap: 12px;
    }

    .order-id {
      font-weight: bold;
      font-size: 13px;
      color: #555;
      min-width: 100px;
    }

    .order-customer {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: #222;
    }

    .order-total {
      font-weight: bold;
      color: #111;
      font-size: 15px;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }

    .badge-pending { background: #fef3c7; color: #b45309; }
    .badge-paid { background: #d1fae5; color: #065f46; }
    .badge-delivered { background: #dbeafe; color: #1e40af; }

    .order-time {
      font-size: 11px;
      color: #aaa;
    }

    .order-body {
      display: none;
      padding: 14px 16px;
      border-top: 1px solid #f0f0f0;
      background: #fafafa;
    }

    .order-body p {
      font-size: 13px;
      color: #555;
      margin-bottom: 6px;
    }

    .order-body strong { color: #333; }

    .order-items {
      background: white;
      border-radius: 8px;
      padding: 10px;
      margin: 10px 0;
      font-size: 13px;
      border: 1px solid #eee;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .action-btn {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .action-btn:hover { opacity: 0.85; }
    .btn-paid { background: #10b981; color: white; }
    .btn-delivered { background: #3b82f6; color: white; }
    .btn-delete { background: #ef4444; color: white; }

    .empty-msg {
      text-align: center;
      color: #aaa;
      padding: 40px;
      background: white;
      border-radius: 12px;
    }

    /* Delete Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.show { display: flex; }

    .modal-box {
      background: white;
      border-radius: 14px;
      padding: 28px 24px;
      max-width: 340px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .modal-box p {
      font-size: 16px;
      color: #333;
      margin-bottom: 20px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .modal-buttons button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-confirm-delete { background: #ef4444; color: white; }
    .btn-cancel-delete { background: #e5e7eb; color: #333; }

    @media (max-width: 600px) {
      .order-id { display: none; }
      #searchPhone { width: 140px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>📦 All Orders</h1>
  </header>

  <div class="controls">
    <button class="filter-btn all" onclick="filterOrders('')">All</button>
    <button class="filter-btn pending" onclick="filterOrders('pending')">Pending</button>
    <button class="filter-btn paid" onclick="filterOrders('Paid')">Paid</button>
    <button class="filter-btn delivered" onclick="filterOrders('Delivered')">Delivered</button>
    <input type="text" id="searchPhone" placeholder="🔍 Search by phone" oninput="renderOrders()" />
  </div>

  <div class="container">
    <div class="stats-bar" id="statsBar"></div>
    <div id="ordersList"></div>
  </div>

  <!-- Delete Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-box">
      <p>Are you sure you want to delete this order?</p>
      <div class="modal-buttons">
        <button class="btn-confirm-delete" onclick="confirmDelete()">Yes, Delete</button>
        <button class="btn-cancel-delete" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const baseUrl = "https://sman-phones-1.onrender.com/api";
    const token = localStorage.getItem("token");

    if (!token) {
      alert("Access denied. Please log in.");
      window.location.href = "admin_login.html";
    }

    let allOrders = [];
    let currentFilter = '';
    let orderToDelete = null;

    function timeAgo(dateString) {
      const now = new Date();
      const past = new Date(dateString);
      const seconds = Math.floor((now - past) / 1000);
      if (seconds < 60) return 'Just now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      if (days < 7) return `${days}d ago`;
      return past.toLocaleDateString();
    }

    async function fetchOrders() {
      try {
        const res = await fetch(`${baseUrl}/orders`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) {
          if (res.status === 401) { window.location.href = 'admin_login.html'; return; }
          throw new Error('Failed to fetch');
        }
        allOrders = await res.json();
        renderStats();
        renderOrders();
      } catch (err) {
        document.getElementById('ordersList').innerHTML = '<div class="empty-msg">Failed to load orders.</div>';
      }
    }

    function renderStats() {
      const total = allOrders.length;
      const paid = allOrders.filter(o => o.payment_status === 'Paid').length;
      const delivered = allOrders.filter(o => o.status === 'Delivered').length;
      const revenue = allOrders
        .filter(o => o.payment_status === 'Paid')
        .reduce((sum, o) => sum + o.total, 0);

      document.getElementById('statsBar').innerHTML = `
        <div class="stat-card">
          <div class="stat-value">${total}</div>
          <div class="stat-label">Total Orders</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" style="color:#10b981">${paid}</div>
          <div class="stat-label">Paid</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" style="color:#3b82f6">${delivered}</div>
          <div class="stat-label">Delivered</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" style="color:#f97316">₦${revenue.toLocaleString()}</div>
          <div class="stat-label">Revenue</div>
        </div>
      `;
    }

    function filterOrders(status) {
      currentFilter = status;
      renderOrders();
    }

    function renderOrders() {
      const phone = document.getElementById('searchPhone').value.trim().toLowerCase();
      const list = document.getElementById('ordersList');

      let filtered = allOrders;

      if (currentFilter) {
        filtered = filtered.filter(o =>
          currentFilter === 'Paid'
            ? o.payment_status === 'Paid'
            : currentFilter === 'Delivered'
            ? o.status === 'Delivered'
            : o.payment_status !== 'Paid' && o.status !== 'Delivered'
        );
      }

      if (phone) {
        filtered = filtered.filter(o =>
          o.customer_phone && o.customer_phone.toLowerCase().includes(phone)
        );
      }

      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty-msg">No orders found.</div>';
        return;
      }

      list.innerHTML = '';

      filtered.forEach(order => {
        const payBadge = order.payment_status === 'Paid'
          ? '<span class="badge badge-paid">Paid</span>'
          : '<span class="badge badge-pending">Unpaid</span>';

        const delBadge = order.status === 'Delivered'
          ? '<span class="badge badge-delivered">Delivered</span>'
          : '<span class="badge badge-pending">Pending</span>';

        // Parse items
        let itemsHtml = '';
        try {
          const items = JSON.parse(order.items);
          itemsHtml = items.map(i => `
            <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f0f0f0;">
              <span>${i.name} x${i.quantity}</span>
              <span>₦${(i.price * i.quantity).toLocaleString()}</span>
            </div>`).join('');
        } catch {
          itemsHtml = `<p>${order.item_names}</p>`;
        }

        const card = document.createElement('div');
        card.className = 'order-card';
        card.innerHTML = `
          <div class="order-header" onclick="toggleOrder('body-${order.id}')">
            <span class="order-id">#${order.order_id}</span>
            <span class="order-customer">${order.customer_name}</span>
            <span class="order-total">₦${order.total.toLocaleString()}</span>
            ${payBadge}
            ${delBadge}
            <span class="order-time">${timeAgo(order.timestamp)}</span>
          </div>
          <div class="order-body" id="body-${order.id}">
            <p><strong>Phone:</strong> ${order.customer_phone}</p>
            <p><strong>Email:</strong> ${order.customer_email || 'N/A'}</p>
            <p><strong>Address:</strong> ${order.customer_address || 'N/A'}</p>
            <p><strong>Reference:</strong> ${order.payment_reference || 'N/A'}</p>
            <div class="order-items">${itemsHtml}</div>
            <div class="action-buttons">
              ${order.payment_status !== 'Paid' ? `<button class="action-btn btn-paid" onclick="markPaid(${order.id})">✅ Mark Paid</button>` : ''}
              ${order.status !== 'Delivered' ? `<button class="action-btn btn-delivered" onclick="markDelivered(${order.id})">🚚 Mark Delivered</button>` : ''}
              <button class="action-btn btn-delete" onclick="openDeleteModal(${order.id})">🗑️ Delete</button>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function toggleOrder(id) {
      const body = document.getElementById(id);
      body.style.display = body.style.display === 'block' ? 'none' : 'block';
    }

    async function markPaid(id) {
      try {
        const res = await fetch(`${baseUrl}/orders/${id}/mark_paid`, {
          method: 'PUT',
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.ok) fetchOrders();
        else alert('Failed to mark as paid.');
      } catch (err) {
        alert('Network error.');
      }
    }

    async function markDelivered(id) {
      try {
        const res = await fetch(`${baseUrl}/orders/${id}/mark_delivered`, {
          method: 'PUT',
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.ok) fetchOrders();
        else alert('Failed to mark as delivered.');
      } catch (err) {
        alert('Network error.');
      }
    }

    function openDeleteModal(id) {
      orderToDelete = id;
      document.getElementById('deleteModal').classList.add('show');
    }

    function closeModal() {
      orderToDelete = null;
      document.getElementById('deleteModal').classList.remove('show');
    }

    async function confirmDelete() {
      if (!orderToDelete) return;
      try {
        const res = await fetch(`${baseUrl}/orders/${orderToDelete}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.ok) fetchOrders();
        else alert('Failed to delete order.');
      } catch (err) {
        alert('Network error.');
      }
      closeModal();
    }

    fetchOrders();
  </script>

</body>
</html>
