<html lang="en">

  <style>
    :root {
      --blue: #1A56DB; --blue-dark: #1040B0; --blue-light: #EEF2FF;
      --black: #0D0D0D; --gray: #4B5563; --gray-light: #F3F4F6;
      --white: #FFFFFF; --white-dim: #6B7280; --border: #E5E7EB;
      --font-display: 'Playfair Display', serif; --font-body: 'Poppins', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--white); color: var(--black); font-family: var(--font-body); font-weight: 300; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: var(--blue); border-radius: 2px; }

    nav { position: sticky; top: 0; z-index: 1000; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.98); border-bottom: 1px solid var(--border); box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
    .nav-logo { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--black); text-decoration: none; }
    .nav-logo span { color: var(--blue); }
    .nav-links { display: flex; gap: 20px; list-style: none; align-items: center; }
    .nav-links a { color: var(--gray); text-decoration: none; font-size: 13px; transition: color 0.2s; }
    .nav-links a:hover { color: var(--blue); }
    .nav-whatsapp { background: #25D366; color: white !important; padding: 7px 14px; border-radius: 20px; font-size: 12px !important; font-weight: 500 !important; }
    .cart-nav { position: relative; color: var(--gray); font-size: 20px; cursor: pointer; }
    .cart-badge { position: absolute; top: -6px; right: -8px; background: var(--blue); color: white; border-radius: 50%; width: 16px; height: 16px; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

    /* Page header */
    .page-header { background: linear-gradient(180deg, #F0F4FF 0%, #FFFFFF 100%); padding: 40px 24px 0; }
    .page-header-inner { max-width: 1200px; margin: 0 auto; }
    .page-header h1 { font-family: var(--font-display); font-size: clamp(22px, 4vw, 32px); color: var(--black); margin-bottom: 6px; }
    .page-header p { font-size: 13px; color: var(--gray); }
    .blue-line { width: 36px; height: 3px; background: var(--blue); border-radius: 2px; margin: 12px 0 20px; }

    /* Category tabs */
    .category-tabs { display: flex; gap: 8px; padding: 0 24px 0; max-width: 1200px; margin: 0 auto 0; flex-wrap: wrap; padding-bottom: 0; }
    .cat-tab { padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1.5px solid var(--border); background: white; color: var(--gray); transition: all 0.2s; font-family: var(--font-body); }
    .cat-tab.active { background: var(--blue); color: white; border-color: var(--blue); }
    .cat-tab:hover:not(.active) { border-color: var(--blue); color: var(--blue); }

    /* Filter banner */
    .filter-banner { display: none; background: var(--blue-light); border-bottom: 1px solid rgba(26,86,219,0.15); padding: 10px 24px; font-size: 13px; color: var(--blue); align-items: center; justify-content: space-between; }
    .filter-banner.show { display: flex; }
    .filter-banner a { color: var(--gray); text-decoration: none; font-size: 12px; }

    /* Layout */
    .layout { display: flex; gap: 24px; max-width: 1200px; margin: 24px auto; padding: 0 24px 60px; }

    /* Sidebar */
    .sidebar { width: 220px; flex-shrink: 0; }
    .filter-section { margin-bottom: 24px; }
    .filter-title { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--blue); margin-bottom: 12px; font-weight: 500; }
    .filter-options { display: flex; flex-direction: column; gap: 8px; }
    .filter-option { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .filter-option input[type=checkbox] { appearance: none; width: 16px; height: 16px; border: 1.5px solid var(--border); border-radius: 3px; background: white; cursor: pointer; flex-shrink: 0; transition: all 0.2s; }
    .filter-option input[type=checkbox]:checked { background: var(--blue); border-color: var(--blue); }
    .filter-option label { font-size: 13px; color: var(--gray); cursor: pointer; }
    .filter-option:hover label { color: var(--black); }
    .price-inputs { display: flex; gap: 8px; align-items: center; }
    .price-input { background: var(--gray-light); border: 1.5px solid var(--border); color: var(--black); padding: 8px 10px; border-radius: 4px; font-size: 12px; width: 100%; font-family: var(--font-body); }
    .price-input:focus { outline: none; border-color: var(--blue); }
    .btn-apply { width: 100%; margin-top: 10px; background: var(--blue); color: white; border: none; padding: 9px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: var(--font-body); }
    .btn-clear { width: 100%; margin-top: 8px; background: white; color: var(--gray); border: 1.5px solid var(--border); padding: 8px; border-radius: 4px; font-size: 12px; cursor: pointer; font-family: var(--font-body); }
    .btn-clear:hover { border-color: var(--blue); color: var(--blue); }

    /* Main */
    .main-content { flex: 1; min-width: 0; }
    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 160px; background: var(--gray-light); border: 1.5px solid var(--border); color: var(--black); padding: 10px 14px; border-radius: 6px; font-size: 13px; font-family: var(--font-body); }
    .search-box:focus { outline: none; border-color: var(--blue); background: white; }
    .search-box::placeholder { color: #9CA3AF; }
    .sort-select { background: var(--gray-light); border: 1.5px solid var(--border); color: var(--black); padding: 10px 12px; border-radius: 6px; font-size: 13px; font-family: var(--font-body); }
    .sort-select:focus { outline: none; border-color: var(--blue); }
    .mobile-filter-btn { display: none; background: white; border: 1.5px solid var(--border); color: var(--blue); padding: 9px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: var(--font-body); }
    .results-count { font-size: 12px; color: var(--gray); white-space: nowrap; }

    /* Product grid */
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
    .product-card { background: white; border: 1.5px solid var(--border); border-radius: 10px; overflow: hidden; cursor: pointer; transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s; }
    .product-card:hover { border-color: var(--blue); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    .product-card img { width: 100%; height: 150px; object-fit: cover; display: block; background: var(--gray-light); }
    .product-card-body { padding: 12px; }
    .product-type-badge { display: inline-block; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--blue); background: var(--blue-light); padding: 2px 7px; border-radius: 3px; margin-bottom: 5px; font-weight: 500; }
    .product-name { font-family: var(--font-display); font-size: 13px; color: var(--black); margin-bottom: 5px; line-height: 1.3; }
    .product-price-row { display: flex; align-items: baseline; gap: 5px; margin-bottom: 3px; }
    .product-price { font-size: 14px; font-weight: 600; color: var(--blue); }
    .product-original { font-size: 11px; color: var(--gray); text-decoration: line-through; }
    .product-meta { font-size: 11px; color: var(--gray); }
    .sold-badge { display: inline-block; background: #FEE2E2; color: #DC2626; font-size: 9px; padding: 2px 6px; border-radius: 3px; margin-top: 3px; font-weight: 500; }

    /* Empty */
    .empty-state { grid-column: 1/-1; text-align: center; padding: 60px 20px; }
    .empty-icon { font-size: 44px; margin-bottom: 14px; display: block; }
    .empty-state h3 { font-family: var(--font-display); font-size: 18px; color: var(--black); margin-bottom: 8px; }
    .empty-state p { font-size: 13px; color: var(--gray); }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: white; border-radius: 14px; max-width: 460px; width: 100%; max-height: 92vh; overflow-y: auto; animation: modalIn 0.25s ease; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
    @keyframes modalIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .modal-img { width: 100%; height: 220px; object-fit: cover; border-radius: 14px 14px 0 0; background: var(--gray-light); }
    .modal-close { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.5); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .modal-body { padding: 20px; }
    .modal-tag { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--blue); margin-bottom: 6px; font-weight: 500; }
    .modal-title { font-family: var(--font-display); font-size: 20px; color: var(--black); margin-bottom: 12px; }
    .modal-price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; }
    .modal-price { font-size: 22px; font-weight: 600; color: var(--blue); }
    .modal-original { font-size: 13px; color: var(--gray); text-decoration: line-through; }
    .specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .spec-item { background: var(--gray-light); border-radius: 6px; padding: 10px 12px; }
    .spec-label { font-size: 9px; color: var(--gray); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 3px; }
    .spec-value { font-size: 13px; color: var(--black); font-weight: 500; }
    .modal-desc { font-size: 13px; color: var(--gray); line-height: 1.65; margin-bottom: 18px; }
    .modal-actions { display: flex; flex-direction: column; gap: 10px; }
    .btn-wa { display: flex; align-items: center; justify-content: center; gap: 8px; background: #25D366; color: white; padding: 13px; border-radius: 6px; font-size: 14px; font-weight: 600; text-decoration: none; }
    .btn-cart { background: var(--blue); color: white; border: none; padding: 13px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--font-body); }
    .sold-notice { background: #FEE2E2; color: #DC2626; padding: 12px; border-radius: 6px; text-align: center; font-size: 13px; font-weight: 500; }

    /* Sidebar overlay mobile */
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500; }
    .sidebar-overlay.show { display: block; }

    .float-wa { position: fixed; bottom: 24px; right: 24px; z-index: 999; background: #25D366; color: white; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 4px 20px rgba(37,211,102,0.35); text-decoration: none; transition: transform 0.2s; }
    .float-wa:hover { transform: scale(1.1); }

    @media (max-width: 768px) {
      .layout { flex-direction: column; padding: 0 12px 60px; }
      .sidebar { position: fixed; top: 0; left: -280px; width: 260px; height: 100vh; overflow-y: auto; background: white; z-index: 600; padding: 60px 20px 40px; transition: left 0.3s; border-right: 1px solid var(--border); }
      .sidebar.open { left: 0; }
      .mobile-filter-btn { display: block; }
      .nav-links { display: none; }
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .category-tabs { padding: 0 12px; overflow-x: auto; flex-wrap: nowrap; }
    }
  </style>
</head>

        // Set URL filters

    function openModal(p) {
      currentProduct = p;
      const outOfStock = p.quantity < 1;
      document.getElementById('modalImg').src = p.image_url || 'https://via.placeholder.com/460x220/F3F4F6/1A56DB?text=📱';
      document.getElementById('modalTag').textContent = [p.condition, p.brand].filter(Boolean).join(' · ');
      document.getElementById('modalTitle').textContent = p.name;
      document.getElementById('modalPrice').textContent = `₦${Number(p.price).toLocaleString()}`;
      document.getElementById('modalOriginal').textContent = p.original_price ? `₦${Number(p.original_price).toLocaleString()}` : '';
      document.getElementById('modalDesc').textContent = p.description || '';
      const specs = [];
      if (p.brand) specs.push({ l: 'Brand', v: p.brand });
      if (p.storage) specs.push({ l: 'Storage', v: p.storage });
      if (p.color) specs.push({ l: 'Color', v: p.color });
      if (p.battery_health) specs.push({ l: 'Battery', v: p.battery_health + '%' });
      if (p.ram) specs.push({ l: 'RAM', v: p.ram });
      document.getElementById('modalSpecs').innerHTML = specs.map(s => `<div class="spec-item"><div class="spec-label">${s.l}</div><div class="spec-value">${s.v}</div></div>`).join('');
      const waText = encodeURIComponent(`Hi Dr Apple! I'm interested in the *${p.name}*. Price: ₦${Number(p.price).toLocaleString()}. Is it available?`);
      document.getElementById('modalActions').innerHTML = outOfStock
        ? `<div class="sold-notice">Currently sold out</div><a href="https://wa.me/${WHATSAPP}?text=${waText}" target="_blank" class="btn-wa" style="margin-top:8px;">💬 Ask about similar items</a>`
        : `<a href="https://wa.me/${WHATSAPP}?text=${waText}" target="_blank" class="btn-wa">💬 Order on WhatsApp</a><button class="btn-cart" onclick="addToCart()">🛒 Add to Cart</button>`;
      document.getElementById('productModal').classList.add('active');
    }

    function closeModal() { document.getElementById('productModal').classList.remove('active'); currentProduct = null; }
    document.getElementById('productModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

function addToCart() {

  if (!currentProduct || currentProduct.quantity < 1) {
    return;
  }

  let cart = JSON.parse(localStorage.getItem('cart')) || [];

  const existing = cart.find(i => i.id === currentProduct.id);

  if (existing) {

    if (existing.quantity >= currentProduct.quantity) {
      alert(`Only ${currentProduct.quantity} available in stock.`);
      return;
    }

    existing.quantity += 1;

  } else {

    cart.push({
      ...currentProduct,
      quantity: 1
    });

  }

  localStorage.setItem('cart', JSON.stringify(cart));

  updateCartCount();
  closeModal();

  const toast = document.createElement('div');
  toast.textContent = 'Added to cart! 🛒';
  toast.style.cssText =
    'position:fixed;bottom:90px;right:24px;background:var(--blue);color:white;padding:10px 18px;border-radius:6px;font-size:13px;font-weight:600;z-index:9999;';

  document.body.appendChild(toast);

  setTimeout(() => toast.remove(), 2500);
}
