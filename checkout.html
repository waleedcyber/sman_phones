<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/png" href="/logo/logo.png" />

  <title>Checkout — Dr Apple</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <script src="https://js.paystack.co/v1/inline.js"></script>

  <style>
    :root {
      --blue: #1A56DB;
      --blue-dark: #1040B0;
      --blue-light: #EEF2FF;

      --black: #0D0D0D;
      --gray: #4B5563;
      --gray-light: #F3F4F6;

      --white: #FFFFFF;
      --border: #E5E7EB;

      --green: #25D366;
      --red: #DC2626;
      --red-light: #FEE2E2;

      --font-display: 'Playfair Display', serif;
      --font-body: 'Poppins', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--white);
      color: var(--black);
      font-family: var(--font-body);
      font-weight: 300;
      min-height: 100vh;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--blue);
      border-radius: 2px;
    }

    /* NAV */

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 14px 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(255, 255, 255, 0.98);
      border-bottom: 1px solid var(--border);

      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    .nav-logo {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      color: var(--black);
      text-decoration: none;
    }

    .nav-logo span {
      color: var(--blue);
    }

    .nav-back {
      color: var(--gray);
      text-decoration: none;
      font-size: 13px;
      transition: color 0.2s;
    }

    .nav-back:hover {
      color: var(--blue);
    }

    /* PAGE */

    .page-wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 38px 18px 90px;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: clamp(25px, 5vw, 32px);
      color: var(--black);
      margin-bottom: 6px;
    }

    .page-subtitle {
      font-size: 13px;
      color: var(--gray);
      margin-bottom: 10px;
    }

    .blue-line {
      width: 36px;
      height: 3px;
      background: var(--blue);
      border-radius: 2px;
      margin: 12px 0 28px;
    }

    /* CARDS */

    .order-summary,
    .form-section,
    .payment-section {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .order-summary h3,
    .form-section h3,
    .payment-section h3 {
      font-family: var(--font-display);
      font-size: 16px;
      color: var(--black);
      margin-bottom: 16px;
    }

    /* ORDER */

    .order-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;

      font-size: 13px;
      padding: 9px 0;

      border-bottom: 1px solid var(--border);
      color: var(--gray);
    }

    .order-item:last-of-type {
      border-bottom: none;
    }

    .order-item-name {
      color: var(--gray);
      line-height: 1.45;
    }

    .order-item-price {
      color: var(--black);
      font-weight: 500;
      white-space: nowrap;
    }

    .order-total {
      display: flex;
      justify-content: space-between;

      padding-top: 16px;
      margin-top: 5px;

      border-top: 1.5px solid var(--border);

      font-size: 17px;
      font-weight: 600;
    }

    .order-total span:last-child {
      color: var(--blue);
    }

    /* STOCK WARNING */

    .stock-warning {
      display: none;

      background: var(--red-light);
      color: var(--red);

      border: 1px solid rgba(220, 38, 38, 0.15);
      border-radius: 7px;

      padding: 11px 13px;
      margin-top: 14px;

      font-size: 12px;
      line-height: 1.5;
    }

    .stock-warning.show {
      display: block;
    }

    /* FORM */

    .form-group {
      margin-bottom: 15px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-label {
      display: block;

      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;

      color: var(--blue);
      margin-bottom: 7px;

      font-weight: 600;
    }

    .form-input {
      width: 100%;

      background: var(--gray-light);
      border: 1.5px solid var(--border);

      color: var(--black);

      padding: 12px 14px;
      border-radius: 5px;

      font-size: 14px;
      font-family: var(--font-body);

      transition: border-color 0.2s, background 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--blue);
      background: var(--white);
    }

    .form-input::placeholder {
      color: #9CA3AF;
    }

    textarea.form-input {
      resize: vertical;
      min-height: 90px;
    }

    /* PAYMENT */

    .payment-section > p {
      font-size: 12px;
      color: var(--gray);
      margin-top: -8px;
      margin-bottom: 16px;
    }

    .payment-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .payment-option {
      display: flex;
      align-items: flex-start;
      gap: 13px;

      background: var(--gray-light);
      border: 1.5px solid var(--border);

      border-radius: 8px;
      padding: 14px 15px;

      cursor: pointer;

      transition:
        border-color 0.2s,
        background 0.2s,
        box-shadow 0.2s;
    }

    .payment-option:hover {
      border-color: var(--blue);
    }

    .payment-option.selected {
      border-color: var(--blue);
      background: var(--blue-light);
      box-shadow: 0 3px 10px rgba(26, 86, 219, 0.06);
    }

    .payment-option input[type="radio"] {
      appearance: none;

      width: 18px;
      height: 18px;

      border: 2px solid #9CA3AF;
      border-radius: 50%;

      flex-shrink: 0;
      margin-top: 2px;

      cursor: pointer;
      position: relative;
    }

    .payment-option input[type="radio"]:checked {
      border-color: var(--blue);
      background: var(--blue);
    }

    .payment-option input[type="radio"]:checked::after {
      content: '';

      position: absolute;
      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 6px;
      height: 6px;

      border-radius: 50%;
      background: white;
    }

    .payment-option-info {
      flex: 1;
    }

    .payment-option-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--black);
      margin-bottom: 4px;
    }

    .payment-option-desc {
      font-size: 11.5px;
      color: var(--gray);
      line-height: 1.55;
    }

    .payment-badge {
      display: inline-block;

      font-size: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;

      padding: 3px 7px;
      border-radius: 3px;

      margin-left: 5px;

      font-weight: 600;
      vertical-align: middle;
    }

    .badge-popular {
      background: var(--blue-light);
      color: var(--blue);
    }

    .badge-instant {
      background: rgba(37, 211, 102, 0.12);
      color: #16A34A;
    }

    /* SUBMIT */

    .submit-wrap {
      margin-top: 4px;
    }

    .btn-submit {
      width: 100%;

      padding: 15px;

      border: none;
      border-radius: 5px;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      font-family: var(--font-body);

      letter-spacing: 0.3px;

      transition:
        opacity 0.2s,
        transform 0.2s,
        box-shadow 0.2s;
    }

    .btn-submit:hover:not(:disabled) {
      opacity: 0.94;
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-whatsapp-submit {
      background: var(--green);
      color: white;

      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.18);
    }

    .btn-pay-submit {
      background: var(--blue);
      color: white;

      box-shadow: 0 4px 12px rgba(26, 86, 219, 0.18);
    }

    .secure-note {
      text-align: center;

      font-size: 10.5px;
      color: var(--gray);

      margin-top: 12px;
    }

    /* STATUS */

    #statusMsg {
      text-align: center;

      padding: 12px;

      border-radius: 6px;

      font-size: 12px;
      font-weight: 500;

      margin-top: 12px;

      display: none;
    }

    #statusMsg.success {
      background: rgba(37, 211, 102, 0.08);
      color: #16A34A;
      border: 1px solid rgba(37, 211, 102, 0.18);
      display: block;
    }

    #statusMsg.error {
      background: var(--red-light);
      color: var(--red);
      border: 1px solid rgba(220, 38, 38, 0.15);
      display: block;
    }

    #statusMsg.loading {
      background: var(--blue-light);
      color: var(--blue);
      border: 1px solid rgba(26, 86, 219, 0.15);
      display: block;
    }

    /* EMPTY CART */

    .empty-redirect {
      text-align: center;
      padding: 80px 20px;
    }

    .empty-icon {
      font-size: 44px;
      display: block;
      margin-bottom: 14px;
    }

    .empty-redirect h2 {
      font-family: var(--font-display);
      font-size: 23px;
      margin-bottom: 9px;
    }

    .empty-redirect p {
      color: var(--gray);
      font-size: 13px;
      margin-bottom: 24px;
    }

    .btn-browse {
      display: inline-block;

      background: var(--blue);
      color: white;

      padding: 12px 26px;

      border-radius: 5px;

      font-size: 13px;
      font-weight: 600;

      text-decoration: none;

      transition: background 0.2s;
    }

    .btn-browse:hover {
      background: var(--blue-dark);
    }

    /* WHATSAPP */

    .float-wa {
      position: fixed;

      bottom: 24px;
      right: 24px;

      z-index: 999;

      background: var(--green);
      color: white;

      width: 52px;
      height: 52px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 22px;

      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.25);

      text-decoration: none;

      transition: transform 0.2s;
    }

    .float-wa:hover {
      transform: scale(1.08);
    }

    /* MOBILE */

    @media (max-width: 600px) {

      nav {
        padding: 13px 15px;
      }

      .page-wrap {
        padding: 28px 12px 80px;
      }

      .order-summary,
      .form-section,
      .payment-section {
        padding: 16px;
      }

      .order-item {
        font-size: 12px;
      }

      .payment-option {
        padding: 13px;
      }

      .payment-option-title {
        font-size: 13px;
      }

      .payment-option-desc {
        font-size: 11px;
      }

      .float-wa {
        width: 48px;
        height: 48px;
        right: 18px;
        bottom: 18px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html" class="nav-logo">
      Dr <span>Apple</span>
    </a>

    <a href="cart.html" class="nav-back">
      ← Back to Cart
    </a>
  </nav>

  <div class="page-wrap" id="pageWrap">
    <!-- Rendered by JS -->
  </div>

  <a
    href="https://wa.me/2348065739757"
    target="_blank"
    class="float-wa"
  >
    💬
  </a>

  <script>

    const baseUrl = "https://sman-phones-1.onrender.com/api";

    const WHATSAPP = "2348065739757";

    const PAYSTACK_PUBLIC_KEY =
      "pk_test_e5ca24ace5786aad1f6f343bb59406dfecd9a542";

    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    const wrap = document.getElementById('pageWrap');

    /*
     * --------------------------------------------------
     * EMPTY CART
     * --------------------------------------------------
     */

    if (cart.length === 0) {

      wrap.innerHTML = `
        <div class="empty-redirect">

          <span class="empty-icon">🛒</span>

          <h2>Your cart is empty</h2>

          <p>
            Add some products before checking out.
          </p>

          <a href="products.html" class="btn-browse">
            Browse Products
          </a>

        </div>
      `;

    } else {

      /*
       * --------------------------------------------------
       * ORDER SUMMARY
       * --------------------------------------------------
       */

      const total = cart.reduce(
        (s, i) => s + Number(i.price) * (i.quantity || 1),
        0
      );

      const totalItems = cart.reduce(
        (s, i) => s + (i.quantity || 1),
        0
      );

      const itemsHtml = cart.map(i => {

        const quantity = i.quantity || 1;

        return `
          <div class="order-item">

            <span class="order-item-name">
              ${i.name}

              ${i.storage
                ? ` (${i.storage})`
                : ''
              }

              × ${quantity}
            </span>

            <span class="order-item-price">
              ₦${(
                Number(i.price) * quantity
              ).toLocaleString()}
            </span>

          </div>
        `;

      }).join('');

      wrap.innerHTML = `

        <h1 class="page-title">
          Checkout
        </h1>

        <p class="page-subtitle">
          Review your order and provide your delivery details.
        </p>

        <div class="blue-line"></div>


        <!-- ORDER SUMMARY -->

        <div class="order-summary">

          <h3>
            📦 Your Order
            (${totalItems} item${totalItems !== 1 ? 's' : ''})
          </h3>

          ${itemsHtml}

          <div class="order-total">

            <span>Total</span>

            <span>
              ₦${total.toLocaleString('en-NG', {
                minimumFractionDigits: 2
              })}
            </span>

          </div>

          <div id="stockWarning" class="stock-warning"></div>

        </div>


        <!-- CUSTOMER DETAILS -->

        <div class="form-section">

          <h3>
            📋 Your Details
          </h3>

          <div class="form-group">

            <label class="form-label">
              Full Name
            </label>

            <input
              class="form-input"
              type="text"
              id="custName"
              placeholder="Your full name"
              required
            />

          </div>


          <div class="form-group">

            <label class="form-label">
              Phone Number
            </label>

            <input
              class="form-input"
              type="tel"
              id="custPhone"
              placeholder="+234 800 000 0000"
              required
            />

          </div>


          <div class="form-group">

            <label class="form-label">
              Email Address
            </label>

            <input
              class="form-input"
              type="email"
              id="custEmail"
              placeholder="you@example.com"
            />

          </div>


          <div class="form-group">

            <label class="form-label">
              Delivery Address
            </label>

            <textarea
              class="form-input"
              id="custAddress"
              placeholder="Street, City, State — or enter 'Pickup' if you'll collect"
            ></textarea>

          </div>

        </div>


        <!-- PAYMENT -->

        <div class="payment-section">

          <h3>
            💳 How would you like to pay?
          </h3>

          <p>
            Choose the option that works best for you.
          </p>


          <div class="payment-options">

            <label
              class="payment-option selected"
              id="opt-whatsapp"
              onclick="selectPayment('whatsapp')"
            >

              <input
                type="radio"
                name="payMethod"
                value="whatsapp"
                checked
              />

              <div class="payment-option-info">

                <div class="payment-option-title">

                  💬 Discuss on WhatsApp

                  <span class="payment-badge badge-popular">
                    Popular
                  </span>

                </div>

                <div class="payment-option-desc">

                  Send your order details to Dr Apple on WhatsApp.
                  Arrange payment directly by bank transfer,
                  cash on delivery, or another agreed method.

                </div>

              </div>

            </label>


            <label
              class="payment-option"
              id="opt-paystack"
              onclick="selectPayment('paystack')"
            >

              <input
                type="radio"
                name="payMethod"
                value="paystack"
              />

              <div class="payment-option-info">

                <div class="payment-option-title">

                  💳 Pay Online Now

                  <span class="payment-badge badge-instant">
                    Instant
                  </span>

                </div>

                <div class="payment-option-desc">

                  Pay securely by card or bank transfer
                  through Paystack.

                </div>

              </div>

            </label>

          </div>

        </div>


        <!-- SUBMIT -->

        <div class="submit-wrap">

          <button
            class="btn-submit btn-whatsapp-submit"
            id="submitBtn"
            onclick="handleSubmit()"
          >
            💬 Send Order via WhatsApp
          </button>

          <p class="secure-note">
            🔒 Your details are safe and never shared without your consent.
          </p>

          <div id="statusMsg"></div>

        </div>

      `;
    }


    /*
     * --------------------------------------------------
     * PAYMENT METHOD
     * --------------------------------------------------
     */

    let selectedMethod = 'whatsapp';


    function selectPayment(method) {

      selectedMethod = method;

      document
        .getElementById('opt-whatsapp')
        .classList
        .toggle(
          'selected',
          method === 'whatsapp'
        );

      document
        .getElementById('opt-paystack')
        .classList
        .toggle(
          'selected',
          method === 'paystack'
        );


      document
        .querySelector(
          `input[value="${method}"]`
        )
        .checked = true;


      const btn =
        document.getElementById('submitBtn');

      if (!btn) return;


      if (method === 'whatsapp') {

        btn.textContent =
          '💬 Send Order via WhatsApp';

        btn.className =
          'btn-submit btn-whatsapp-submit';

      } else {

        const total =
          cart.reduce(
            (s, i) =>
              s + Number(i.price) * (i.quantity || 1),
            0
          );

        btn.textContent =
          '💳 Pay Now — ₦' +
          total.toLocaleString();

        btn.className =
          'btn-submit btn-pay-submit';
      }
    }


    /*
     * --------------------------------------------------
     * FORM VALIDATION
     * --------------------------------------------------
     */

    function validateForm() {

      const name =
        document.getElementById('custName')
          .value
          .trim();

      const phone =
        document.getElementById('custPhone')
          .value
          .trim();


      if (!name) {

        showMsg(
          'Please enter your full name.',
          'error'
        );

        return false;
      }


      if (!phone) {

        showMsg(
          'Please enter your phone number.',
          'error'
        );

        return false;
      }


      return true;
    }


    /*
     * --------------------------------------------------
     * FRONTEND STOCK CHECK
     *
     * This protects the normal website flow.
     * The backend MUST still perform its own
     * database stock check.
     * --------------------------------------------------
     */

    function validateCartStock() {

      const warnings = [];


      cart.forEach(item => {

        const requested =
          Number(item.quantity || 1);

        const available =
          Number(item.quantity_available ?? item.stock ?? item.quantity);


        /*
         * Products page currently stores the product's
         * quantity in the same "quantity" property as
         * the cart quantity.
         *
         * Because your cart replaces quantity with the
         * customer's selected quantity, we cannot
         * reliably distinguish the original stock here.
         *
         * Therefore the real stock check MUST happen
         * in the backend.
         *
         * We only reject obviously invalid quantities here.
         */

        if (requested < 1) {

          warnings.push(
            `${item.name} has an invalid quantity.`
          );

        }

      });


      if (warnings.length) {

        const warning =
          document.getElementById('stockWarning');

        if (warning) {

          warning.innerHTML =
            warnings.join('<br>');

          warning.classList.add('show');
        }

        return false;
      }


      return true;
    }


    /*
     * --------------------------------------------------
     * STATUS MESSAGE
     * --------------------------------------------------
     */

    function showMsg(text, type) {

      const el =
        document.getElementById('statusMsg');

      if (!el) return;

      el.textContent = text;
      el.className = type;
    }


    /*
     * --------------------------------------------------
     * SUBMIT
     * --------------------------------------------------
     */

    async function handleSubmit() {

      if (!validateForm()) {
        return;
      }


      if (!validateCartStock()) {
        return;
      }


      const btn =
        document.getElementById('submitBtn');

      btn.disabled = true;


      const name =
        document.getElementById('custName')
          .value
          .trim();

      const phone =
        document.getElementById('custPhone')
          .value
          .trim();

      const email =
        document.getElementById('custEmail')
          .value
          .trim();

      const address =
        document.getElementById('custAddress')
          .value
          .trim();


      const total =
        cart.reduce(
          (s, i) =>
            s + Number(i.price) * (i.quantity || 1),
          0
        );


      if (selectedMethod === 'whatsapp') {

        await handleWhatsApp(
          name,
          phone,
          email,
          address,
          total
        );

      } else {

        await handlePaystack(
          name,
          phone,
          email,
          address,
          total
        );

      }


      btn.disabled = false;
    }


    /*
     * --------------------------------------------------
     * BUILD ORDER ITEMS
     * --------------------------------------------------
     */

    function buildOrderItems() {

      return cart.map(i => ({

        /*
         * IMPORTANT:
         * The backend should use this ID to find
         * the actual Product in the database.
         */

        product_id: i.id,

        name: i.name,

        price: Number(i.price),

        quantity: Number(i.quantity || 1)

      }));
    }


    /*
     * --------------------------------------------------
     * WHATSAPP ORDER
     * --------------------------------------------------
     */

    async function handleWhatsApp(
      name,
      phone,
      email,
      address,
      total
    ) {

      showMsg(
        'Creating your order...',
        'loading'
      );


      try {

        const orderData = {

          name,

          phone,

          email:
            email || phone + '@guest.com',

          address:
            address || 'Not provided',

          items:
            buildOrderItems(),

          total

        };


        const res =
          await fetch(
            `${baseUrl}/orders`,
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body:
                JSON.stringify(orderData)
            }
          );


        /*
         * IMPORTANT:
         * Do NOT open WhatsApp if the backend rejected
         * the order because of stock.
         */

        if (!res.ok) {

          let errorMessage =
            'Unable to create your order.';

          try {

            const errorData =
              await res.json();

            errorMessage =
              errorData.detail ||
              errorMessage;

          } catch {}


          showMsg(
            errorMessage,
            'error'
          );

          return;
        }


        const data =
          await res.json();


        const orderId =
          data?.order_id ||
          data?.order?.order_id ||
          'N/A';


        const itemLines =
          cart.map(i => {

            const quantity =
              i.quantity || 1;

            return (
              `• ${i.name}` +
              `${i.storage ? ` (${i.storage})` : ''}` +
              ` × ${quantity}` +
              ` — ₦${(
                Number(i.price) * quantity
              ).toLocaleString()}`
            );

          }).join('\n');


        const msg =
          encodeURIComponent(

            `Hello Dr Apple! 👋\n\n` +

            `I'd like to place an order:\n\n` +

            `*Order ID:* ${orderId}\n` +

            `*Name:* ${name}\n` +

            `*Phone:* ${phone}\n` +

            `${address
              ? `*Address:* ${address}\n`
              : ''
            }` +

            `\n*Items:*\n` +

            `${itemLines}\n\n` +

            `*Total: ₦${total.toLocaleString()}*\n\n` +

            `Please confirm availability and payment details. Thank you!`

          );


        /*
         * Clear cart only AFTER the backend successfully
         * created the order.
         */

        localStorage.removeItem('cart');


        window.open(
          `https://wa.me/${WHATSAPP}?text=${msg}`,
          '_blank'
        );


        window.location.href =
          `order_success.html?ref=${orderId}&method=whatsapp`;


      } catch (err) {

        console.error(err);

        showMsg(
          'Could not connect to the server. Please try again.',
          'error'
        );

      }
    }


    /*
     * --------------------------------------------------
     * PAYSTACK
     * --------------------------------------------------
     */

    async function handlePaystack(
      name,
      phone,
      email,
      address,
      total
    ) {

      if (!email) {

        showMsg(
          'Please enter your email address for online payment.',
          'error'
        );

        document.getElementById(
          'submitBtn'
        ).disabled = false;

        return;
      }


      showMsg(
        'Creating your order...',
        'loading'
      );


      try {

        /*
         * CREATE ORDER
         */

        const orderData = {

          name,

          phone,

          email,

          address:
            address || 'Not provided',

          items:
            buildOrderItems(),

          total

        };


        const res =
          await fetch(
            `${baseUrl}/orders`,
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body:
                JSON.stringify(orderData)
            }
          );


        /*
         * If backend rejects because of stock,
         * do NOT start Paystack.
         */

        if (!res.ok) {

          let errorMessage =
            'Unable to create your order.';

          try {

            const errorData =
              await res.json();

            errorMessage =
              errorData.detail ||
              errorMessage;

          } catch {}


          showMsg(
            errorMessage,
            'error'
          );

          return;
        }


        const data =
          await res.json();


        const orderId =
          data?.order_id ||
          data?.order?.order_id;


        if (!orderId) {

          throw new Error(
            'No order ID returned'
          );
        }


        /*
         * INITIALIZE PAYMENT
         */

        const initRes =
          await fetch(
            `${baseUrl}/payments/initialize`,
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body:
                JSON.stringify({
                  email,
                  amount: total,
                  order_id: orderId
                })
            }
          );


        if (!initRes.ok) {

          throw new Error(
            'Payment initialization failed'
          );
        }


        const initData =
          await initRes.json();


        const authUrl =
          initData.authorization_url ||
          initData.data?.authorization_url;


        if (!authUrl) {

          throw new Error(
            'No payment URL returned'
          );
        }


        /*
         * Only clear the cart once Paystack has
         * successfully given us the payment URL.
         */

        localStorage.removeItem('cart');


        window.location.href =
          authUrl;


      } catch (err) {

        console.error(err);

        showMsg(
          'Payment setup failed. Please try WhatsApp instead.',
          'error'
        );

        document.getElementById(
          'submitBtn'
        ).disabled = false;
      }
    }

  </script>
