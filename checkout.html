<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo/logo.png" />
  <title>Checkout — SmanAppleComms</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <style>
    :root {
      --gold: #C9A84C; --gold-light: #E8C96A; --gold-dim: #8B6914;
      --black: #0A0A0A; --black-2: #111111; --black-3: #1A1A1A; --black-4: #222222;
      --white: #F5F5F0; --white-dim: #AAAAAA;
      --green: #25D366;
      --font-display: 'Playfair Display', serif; --font-body: 'Poppins', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--black); color: var(--white); font-family: var(--font-body); font-weight: 300; min-height: 100vh; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }

    nav { position: sticky; top: 0; z-index: 100; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; background: rgba(10,10,10,0.98); border-bottom: 1px solid rgba(201,168,76,0.12); }
    .nav-logo { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--gold); text-decoration: none; }
    .nav-back { color: var(--white-dim); text-decoration: none; font-size: 13px; transition: color 0.2s; }
    .nav-back:hover { color: var(--gold); }

    .page-wrap { max-width: 680px; margin: 0 auto; padding: 32px 16px 80px; }
    .page-title { font-family: var(--font-display); font-size: 28px; color: var(--white); margin-bottom: 6px; }
    .gold-line { width: 36px; height: 2px; background: var(--gold); margin: 12px 0 28px; }

    /* Order summary */
    .order-summary { background: var(--black-3); border: 1px solid rgba(201,168,76,0.1); border-radius: 10px; padding: 18px; margin-bottom: 24px; }
    .order-summary h3 { font-family: var(--font-display); font-size: 15px; color: var(--white); margin-bottom: 14px; }
    .order-item { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--white-dim); }
    .order-item:last-of-type { border-bottom: none; }
    .order-item span:last-child { color: var(--white); font-weight: 500; }
    .order-total { display: flex; justify-content: space-between; padding-top: 14px; margin-top: 4px; border-top: 1px solid rgba(201,168,76,0.15); font-size: 16px; font-weight: 600; }
    .order-total span:last-child { color: var(--gold); }

    /* Form */
    .form-section { background: var(--black-3); border: 1px solid rgba(201,168,76,0.1); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    .form-section h3 { font-family: var(--font-display); font-size: 15px; color: var(--white); margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); margin-bottom: 7px; font-weight: 500; }
    .form-input { width: 100%; background: var(--black-4); border: 1px solid rgba(201,168,76,0.15); color: var(--white); padding: 12px 14px; border-radius: 4px; font-size: 14px; font-family: var(--font-body); transition: border-color 0.2s; }
    .form-input:focus { outline: none; border-color: var(--gold); }
    .form-input::placeholder { color: rgba(170,170,170,0.5); }
    textarea.form-input { resize: vertical; min-height: 80px; }

    /* Payment method selector */
    .payment-section { background: var(--black-3); border: 1px solid rgba(201,168,76,0.1); border-radius: 10px; padding: 20px; margin-bottom: 24px; }
    .payment-section h3 { font-family: var(--font-display); font-size: 15px; color: var(--white); margin-bottom: 6px; }
    .payment-section p { font-size: 12px; color: var(--white-dim); margin-bottom: 16px; }
    .payment-options { display: flex; flex-direction: column; gap: 10px; }
    .payment-option { display: flex; align-items: flex-start; gap: 14px; background: var(--black-4); border: 2px solid rgba(201,168,76,0.1); border-radius: 8px; padding: 14px 16px; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
    .payment-option.selected { border-color: var(--gold); background: rgba(201,168,76,0.05); }
    .payment-option input[type=radio] { appearance: none; width: 18px; height: 18px; border: 2px solid var(--gold-dim); border-radius: 50%; flex-shrink: 0; margin-top: 2px; cursor: pointer; transition: border-color 0.2s; position: relative; }
    .payment-option input[type=radio]:checked { border-color: var(--gold); background: var(--gold); }
    .payment-option input[type=radio]:checked::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 6px; height: 6px; border-radius: 50%; background: var(--black); }
    .payment-option-info { flex: 1; }
    .payment-option-title { font-size: 14px; font-weight: 500; color: var(--white); margin-bottom: 3px; }
    .payment-option-desc { font-size: 12px; color: var(--white-dim); line-height: 1.4; }
    .payment-badge { display: inline-block; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; margin-left: 6px; font-weight: 600; vertical-align: middle; }
    .badge-popular { background: rgba(201,168,76,0.15); color: var(--gold); }
    .badge-instant { background: rgba(37,211,102,0.15); color: #25D366; }

    /* Submit button */
    .submit-wrap { margin-top: 4px; }
    .btn-submit { width: 100%; padding: 16px; border: none; border-radius: 4px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--font-body); letter-spacing: 0.5px; transition: opacity 0.2s, transform 0.2s; }
    .btn-submit:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-whatsapp-submit { background: var(--green); color: white; }
    .btn-pay-submit { background: var(--gold); color: var(--black); }
    .secure-note { text-align: center; font-size: 11px; color: var(--white-dim); margin-top: 12px; }

    /* Message */
    #statusMsg { text-align: center; padding: 12px; border-radius: 6px; font-size: 13px; font-weight: 500; margin-top: 12px; display: none; }
    #statusMsg.success { background: rgba(37,211,102,0.1); color: #25D366; border: 1px solid rgba(37,211,102,0.2); display: block; }
    #statusMsg.error { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); display: block; }
    #statusMsg.loading { background: rgba(201,168,76,0.1); color: var(--gold); border: 1px solid rgba(201,168,76,0.2); display: block; }

    /* Empty cart redirect */
    .empty-redirect { text-align: center; padding: 80px 20px; }
    .empty-redirect h2 { font-family: var(--font-display); font-size: 22px; margin-bottom: 10px; }
    .empty-redirect p { color: var(--white-dim); font-size: 14px; margin-bottom: 24px; }
    .btn-browse { display: inline-block; background: var(--gold); color: var(--black); padding: 13px 28px; border-radius: 4px; font-size: 13px; font-weight: 600; text-decoration: none; }

    /* Float WA */
    .float-wa { position: fixed; bottom: 24px; right: 24px; z-index: 999; background: #25D366; color: white; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 4px 20px rgba(37,211,102,0.35); text-decoration: none; transition: transform 0.2s; }
    .float-wa:hover { transform: scale(1.1); }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">SmanAppleComms</a>
    <a href="cart.html" class="nav-back">← Back to Cart</a>
  </nav>

  <div class="page-wrap" id="pageWrap">
    <!-- Rendered by JS -->
  </div>

  <a href="https://wa.me/2348065739757" target="_blank" class="float-wa">💬</a>

  <script>
    const baseUrl = "https://s-and-s-collection-32bh.onrender.com/api";
    const WHATSAPP = "2348065739757";
    const PAYSTACK_PUBLIC_KEY = "pk_test_e5ca24ace5786aad1f6f343bb59406dfecd9a542"; // update with real key

    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const wrap = document.getElementById('pageWrap');

    if (cart.length === 0) {
      wrap.innerHTML = `
        <div class="empty-redirect">
          <h2>Your cart is empty</h2>
          <p>Add some phones before checking out.</p>
          <a href="products.html" class="btn-browse">Browse Phones</a>
        </div>`;
    } else {
      const total = cart.reduce((s, i) => s + i.price * (i.quantity || 1), 0);
      const totalItems = cart.reduce((s, i) => s + (i.quantity || 1), 0);

      const itemsHtml = cart.map(i => `
        <div class="order-item">
          <span>${i.name}${i.storage ? ` (${i.storage})` : ''} × ${i.quantity || 1}</span>
          <span>₦${(i.price * (i.quantity || 1)).toLocaleString()}</span>
        </div>`).join('');

      wrap.innerHTML = `
        <h1 class="page-title">Checkout</h1>
        <div class="gold-line"></div>

        <!-- Order summary -->
        <div class="order-summary">
          <h3>📦 Your Order (${totalItems} item${totalItems !== 1 ? 's' : ''})</h3>
          ${itemsHtml}
          <div class="order-total">
            <span>Total</span>
            <span>₦${total.toLocaleString('en-NG', {minimumFractionDigits:2})}</span>
          </div>
        </div>

        <!-- Contact details -->
        <div class="form-section">
          <h3>📋 Your Details</h3>
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input class="form-input" type="text" id="custName" placeholder="Your full name" required />
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input class="form-input" type="tel" id="custPhone" placeholder="+234 800 000 0000" required />
          </div>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input class="form-input" type="email" id="custEmail" placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label class="form-label">Delivery Address</label>
            <textarea class="form-input" id="custAddress" placeholder="Street, City, State — or enter 'Pickup' if you'll collect"></textarea>
          </div>
        </div>

        <!-- Payment method -->
        <div class="payment-section">
          <h3>💳 How would you like to pay?</h3>
          <p>Choose the option that works best for you.</p>
          <div class="payment-options">

            <label class="payment-option selected" id="opt-whatsapp" onclick="selectPayment('whatsapp')">
              <input type="radio" name="payMethod" value="whatsapp" checked />
              <div class="payment-option-info">
                <div class="payment-option-title">💬 Discuss on WhatsApp <span class="payment-badge badge-popular">Popular</span></div>
                <div class="payment-option-desc">We'll send your order details to the seller on WhatsApp. Arrange payment directly — bank transfer, cash on delivery, or any method you agree on.</div>
              </div>
            </label>

            <label class="payment-option" id="opt-paystack" onclick="selectPayment('paystack')">
              <input type="radio" name="payMethod" value="paystack" />
              <div class="payment-option-info">
                <div class="payment-option-title">💳 Pay Online Now <span class="payment-badge badge-instant">Instant</span></div>
                <div class="payment-option-desc">Pay securely via card or bank transfer through Paystack. Your order is confirmed immediately after payment.</div>
              </div>
            </label>

          </div>
        </div>

        <div class="submit-wrap">
          <button class="btn-submit btn-whatsapp-submit" id="submitBtn" onclick="handleSubmit()">
            💬 Send Order via WhatsApp
          </button>
          <p class="secure-note">🔒 Your details are safe and never shared without your consent</p>
          <div id="statusMsg"></div>
        </div>
      `;
    }

    let selectedMethod = 'whatsapp';

    function selectPayment(method) {
      selectedMethod = method;
      document.getElementById('opt-whatsapp').classList.toggle('selected', method === 'whatsapp');
      document.getElementById('opt-paystack').classList.toggle('selected', method === 'paystack');
      const btn = document.getElementById('submitBtn');
      if (method === 'whatsapp') {
        btn.textContent = '💬 Send Order via WhatsApp';
        btn.className = 'btn-submit btn-whatsapp-submit';
      } else {
        btn.textContent = '💳 Pay Now — ₦' + cart.reduce((s, i) => s + i.price * (i.quantity || 1), 0).toLocaleString();
        btn.className = 'btn-submit btn-pay-submit';
      }
    }

    function validateForm() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      if (!name) { showMsg('Please enter your full name.', 'error'); return false; }
      if (!phone) { showMsg('Please enter your phone number.', 'error'); return false; }
      return true;
    }

    function showMsg(text, type) {
      const el = document.getElementById('statusMsg');
      el.textContent = text;
      el.className = type;
    }

    async function handleSubmit() {
      if (!validateForm()) return;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;

      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const email = document.getElementById('custEmail').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const total = cart.reduce((s, i) => s + i.price * (i.quantity || 1), 0);

      if (selectedMethod === 'whatsapp') {
        await handleWhatsApp(name, phone, email, address, total);
      } else {
        await handlePaystack(name, phone, email, address, total);
      }

      btn.disabled = false;
    }

    async function handleWhatsApp(name, phone, email, address, total) {
      showMsg('Creating your order...', 'loading');

      try {
        // Create order in backend
        const orderData = {
          name, phone, email: email || phone + '@guest.com',
          address: address || 'Not provided',
          items: cart.map(i => ({ name: i.name, price: i.price, quantity: i.quantity || 1 })),
          total
        };

        const res = await fetch(`${baseUrl}/orders`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });

        const data = res.ok ? await res.json() : null;
        const orderId = data?.order_id || data?.order?.order_id || 'N/A';

        // Build WhatsApp message
        const itemLines = cart.map(i => `• ${i.name}${i.storage ? ` (${i.storage})` : ''} × ${i.quantity || 1} — ₦${(i.price * (i.quantity || 1)).toLocaleString()}`).join('\n');
        const msg = encodeURIComponent(
          `Hello SmanAppleComms! 👋\n\n` +
          `I'd like to place an order:\n\n` +
          `*Order ID:* ${orderId}\n` +
          `*Name:* ${name}\n` +
          `*Phone:* ${phone}\n` +
          `${address ? `*Address:* ${address}\n` : ''}` +
          `\n*Items:*\n${itemLines}\n\n` +
          `*Total: ₦${total.toLocaleString()}*\n\n` +
          `Please confirm availability and payment details. Thank you!`
        );

        // Clear cart
        localStorage.removeItem('cart');

        // Open WhatsApp
        window.open(`https://wa.me/${WHATSAPP}?text=${msg}`, '_blank');
        window.location.href = `order_success.html?ref=${orderId}&method=whatsapp`;

      } catch (err) {
        console.error(err);
        // Still open WhatsApp even if backend fails
        const itemLines = cart.map(i => `• ${i.name} × ${i.quantity || 1}`).join('\n');
        const msg = encodeURIComponent(`Hello SmanAppleComms! I'd like to order:\n\n${itemLines}\n\nTotal: ₦${total.toLocaleString()}\n\nMy name: ${name}\nPhone: ${phone}`);
        window.open(`https://wa.me/${WHATSAPP}?text=${msg}`, '_blank');
        localStorage.removeItem('cart');
        window.location.href = 'order_success.html?method=whatsapp';
      }
    }

    async function handlePaystack(name, phone, email, address, total) {
      if (!email) {
        showMsg('Please enter your email address for online payment.', 'error');
        document.getElementById('submitBtn').disabled = false;
        return;
      }

      showMsg('Creating your order...', 'loading');

      try {
        // Create order first
        const orderData = {
          name, phone, email,
          address: address || 'Not provided',
          items: cart.map(i => ({ name: i.name, price: i.price, quantity: i.quantity || 1 })),
          total
        };

        const res = await fetch(`${baseUrl}/orders`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });

        const data = res.ok ? await res.json() : null;
        const orderId = data?.order_id || data?.order?.order_id || 'N/A';

        // Initialize Paystack
        const initRes = await fetch(`${baseUrl}/payments/initialize`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, amount: total, order_id: orderId })
        });

        if (!initRes.ok) throw new Error('Payment initialization failed');
        const initData = await initRes.json();
        const authUrl = initData.authorization_url || initData.data?.authorization_url;
        if (!authUrl) throw new Error('No payment URL returned');

        localStorage.removeItem('cart');
        window.location.href = authUrl;

      } catch (err) {
        console.error(err);
        showMsg('Payment setup failed. Please try WhatsApp instead.', 'error');
        document.getElementById('submitBtn').disabled = false;
      }
    }
  </script>
</body>
</html>
