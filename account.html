<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo/logo.png" />
  <title>My Account — SmanAppleComms</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A84C; --gold-light: #E8C96A; --gold-dim: #8B6914;
      --black: #0A0A0A; --black-2: #111111; --black-3: #1A1A1A; --black-4: #222222;
      --white: #F5F5F0; --white-dim: #AAAAAA;
      --font-display: 'Playfair Display', serif; --font-body: 'Poppins', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--black); color: var(--white); font-family: var(--font-body); font-weight: 300; min-height: 100vh; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }

    nav { position: sticky; top: 0; z-index: 100; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; background: rgba(10,10,10,0.98); border-bottom: 1px solid rgba(201,168,76,0.12); }
    .nav-logo { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--gold); text-decoration: none; }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .nav-link { color: var(--white-dim); text-decoration: none; font-size: 13px; transition: color 0.2s; }
    .nav-link:hover { color: var(--gold); }
    .btn-logout { background: none; border: 1px solid rgba(239,68,68,0.3); color: rgba(239,68,68,0.7); padding: 6px 14px; border-radius: 4px; font-size: 12px; cursor: pointer; font-family: var(--font-body); transition: all 0.2s; }
    .btn-logout:hover { border-color: #ef4444; color: #ef4444; }

    .page { max-width: 700px; margin: 0 auto; padding: 32px 16px 80px; }

    /* Profile card */
    .profile-card { background: var(--black-3); border: 1px solid rgba(201,168,76,0.12); border-radius: 12px; padding: 24px 20px; margin-bottom: 24px; display: flex; align-items: center; gap: 18px; }
    .avatar { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-dim)); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--black); flex-shrink: 0; }
    .profile-info { flex: 1; min-width: 0; }
    .profile-name { font-family: var(--font-display); font-size: 18px; color: var(--white); margin-bottom: 3px; }
    .profile-email { font-size: 12px; color: var(--white-dim); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .profile-phone { font-size: 12px; color: var(--white-dim); }
    .member-badge { display: inline-block; background: rgba(201,168,76,0.1); color: var(--gold); font-size: 10px; padding: 3px 8px; border-radius: 10px; border: 1px solid rgba(201,168,76,0.2); margin-top: 6px; letter-spacing: 1px; text-transform: uppercase; font-weight: 500; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
    .stat { background: var(--black-3); border: 1px solid rgba(201,168,76,0.08); border-radius: 8px; padding: 14px; text-align: center; }
    .stat-val { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--gold); }
    .stat-lbl { font-size: 10px; color: var(--white-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 3px; }

    /* Section */
    .section-label { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; font-weight: 500; }

    /* Order cards */
    .order-card { background: var(--black-3); border: 1px solid rgba(201,168,76,0.08); border-radius: 10px; margin-bottom: 10px; overflow: hidden; transition: border-color 0.2s; }
    .order-card:hover { border-color: rgba(201,168,76,0.2); }
    .order-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; }
    .order-info { flex: 1; min-width: 0; }
    .order-id { font-size: 12px; color: var(--gold); font-weight: 500; margin-bottom: 2px; }
    .order-items-preview { font-size: 13px; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .order-meta { font-size: 11px; color: var(--white-dim); margin-top: 2px; }
    .order-right { text-align: right; flex-shrink: 0; }
    .order-total { font-size: 15px; font-weight: 600; color: var(--gold); }
    .order-time { font-size: 10px; color: var(--white-dim); margin-top: 2px; }
    .badge { font-size: 10px; padding: 2px 8px; border-radius: 3px; font-weight: 500; display: inline-block; margin-top: 4px; }
    .badge-paid { background: rgba(37,211,102,0.1); color: #25D366; }
    .badge-unpaid { background: rgba(249,115,22,0.1); color: #f97316; }
    .badge-delivered { background: rgba(59,130,246,0.1); color: #60a5fa; }
    .badge-pending { background: rgba(156,163,175,0.1); color: #9ca3af; }

    .order-body { display: none; padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.04); background: var(--black-4); }
    .order-body.open { display: block; }
    .order-detail { font-size: 13px; color: var(--white-dim); margin-bottom: 6px; }
    .order-detail strong { color: var(--white); }
    .items-list { background: var(--black-3); border-radius: 6px; padding: 10px 12px; margin: 10px 0; font-size: 12px; color: var(--white-dim); line-height: 1.8; }
    .wa-btn { display: inline-flex; align-items: center; gap: 6px; background: #25D366; color: white; padding: 9px 16px; border-radius: 4px; font-size: 12px; font-weight: 600; text-decoration: none; margin-top: 8px; transition: opacity 0.2s; }
    .wa-btn:hover { opacity: 0.9; }

    /* Quick links */
    .quick-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
    .quick-link { background: var(--black-3); border: 1px solid rgba(201,168,76,0.08); border-radius: 8px; padding: 16px; text-decoration: none; display: flex; align-items: center; gap: 12px; transition: border-color 0.2s; }
    .quick-link:hover { border-color: rgba(201,168,76,0.25); }
    .quick-link-icon { font-size: 20px; }
    .quick-link-text { font-size: 13px; color: var(--white-dim); }

    .empty { text-align: center; padding: 50px 20px; color: var(--white-dim); }
    .empty-icon { font-size: 40px; margin-bottom: 14px; display: block; }
    .empty h3 { font-family: var(--font-display); font-size: 18px; color: var(--white); margin-bottom: 8px; }
    .btn-browse { display: inline-block; background: var(--gold); color: var(--black); padding: 12px 24px; border-radius: 4px; font-size: 13px; font-weight: 600; text-decoration: none; margin-top: 16px; transition: background 0.2s; }
    .btn-browse:hover { background: var(--gold-light); }

    .float-wa { position: fixed; bottom: 24px; right: 24px; z-index: 999; background: #25D366; color: white; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 4px 20px rgba(37,211,102,0.35); text-decoration: none; transition: transform 0.2s; }
    .float-wa:hover { transform: scale(1.1); }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">SmanAppleComms</a>
    <div class="nav-right">
      <a href="products.html" class="nav-link">Phones</a>
      <a href="cart.html" class="nav-link">🛒 Cart</a>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <div class="page">
    <!-- Profile -->
    <div class="profile-card" id="profileCard">
      <div class="avatar" id="avatarInitial">?</div>
      <div class="profile-info">
        <div class="profile-name" id="profileName">Loading...</div>
        <div class="profile-email" id="profileEmail"></div>
        <div class="profile-phone" id="profilePhone"></div>
        <span class="member-badge">⭐ Member</span>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat"><div class="stat-val" id="statTotal">—</div><div class="stat-lbl">Orders</div></div>
      <div class="stat"><div class="stat-val" id="statPaid" style="color:#25D366;">—</div><div class="stat-lbl">Paid</div></div>
      <div class="stat"><div class="stat-val" id="statSpent" style="font-size:16px;">—</div><div class="stat-lbl">Spent</div></div>
    </div>

    <!-- Quick links -->
    <div class="section-label">Quick Actions</div>
    <div class="quick-links">
      <a href="products.html" class="quick-link">
        <span class="quick-link-icon">📱</span>
        <span class="quick-link-text">Browse Phones</span>
      </a>
      <a href="trade_in.html" class="quick-link">
        <span class="quick-link-icon">🔄</span>
        <span class="quick-link-text">Trade-In Request</span>
      </a>
      <a href="https://wa.me/2348065739757" target="_blank" class="quick-link">
        <span class="quick-link-icon">💬</span>
        <span class="quick-link-text">Chat with Us</span>
      </a>
      <a href="forgot_password.html" class="quick-link">
        <span class="quick-link-icon">🔑</span>
        <span class="quick-link-text">Change Password</span>
      </a>
    </div>

    <!-- Orders -->
    <div class="section-label">My Orders</div>
    <div id="ordersList"><div class="empty"><span class="empty-icon">📦</span>Loading orders...</div></div>
  </div>

  <a href="https://wa.me/2348065739757" target="_blank" class="float-wa">💬</a>

  <script>
    const baseUrl = "https://s-and-s-collection-32bh.onrender.com/api";
    const token = localStorage.getItem('userToken');
    if (!token) window.location.href = 'login.html';

    function logout() {
      localStorage.removeItem('userToken');
      window.location.href = 'index.html';
    }

    function timeAgo(d) {
      const s = Math.floor((new Date() - new Date(d)) / 1000);
      if (s < 60) return 'Just now';
      if (s < 3600) return Math.floor(s/60) + 'm ago';
      if (s < 86400) return Math.floor(s/3600) + 'h ago';
      return Math.floor(s/86400) + 'd ago';
    }

    function toggle(id) {
      document.getElementById('body-' + id).classList.toggle('open');
    }

    async function loadProfile() {
      try {
        const res = await fetch(`${baseUrl}/user/profile`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.status === 401) { logout(); return; }
        if (!res.ok) return;
        const user = await res.json();
        document.getElementById('avatarInitial').textContent = user.name.charAt(0).toUpperCase();
        document.getElementById('profileName').textContent = user.name;
        document.getElementById('profileEmail').textContent = user.email;
        document.getElementById('profilePhone').textContent = user.phone || '';
      } catch { console.error('Failed to load profile'); }
    }

    async function loadOrders() {
      try {
        const res = await fetch(`${baseUrl}/user/orders`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.status === 401) { logout(); return; }
        const orders = res.ok ? await res.json() : [];

        // Stats
        document.getElementById('statTotal').textContent = orders.length;
        const paid = orders.filter(o => o.payment_status === 'Paid');
        document.getElementById('statPaid').textContent = paid.length;
        const spent = paid.reduce((s, o) => s + o.total, 0);
        document.getElementById('statSpent').textContent = '₦' + spent.toLocaleString();

        const list = document.getElementById('ordersList');
        if (orders.length === 0) {
          list.innerHTML = `
            <div class="empty">
              <span class="empty-icon">📦</span>
              <h3>No orders yet</h3>
              <p>Browse our phones and place your first order.</p>
              <a href="products.html" class="btn-browse">Browse Phones</a>
            </div>`;
          return;
        }

        list.innerHTML = orders.map(o => {
          let itemsHtml = '';
          try {
            itemsHtml = JSON.parse(o.items).map(i => `${i.name} × ${i.quantity} — ₦${(i.price * i.quantity).toLocaleString()}`).join('<br>');
          } catch { itemsHtml = o.item_names; }

          const waMsg = encodeURIComponent(`Hi, I'd like to follow up on my order #${o.order_id}`);

          return `
          <div class="order-card">
            <div class="order-header" onclick="toggle(${o.id})">
              <div class="order-info">
                <div class="order-id">#${o.order_id}</div>
                <div class="order-items-preview">${o.item_names}</div>
                <div class="order-meta">${timeAgo(o.timestamp)}</div>
              </div>
              <div class="order-right">
                <div class="order-total">₦${Number(o.total).toLocaleString()}</div>
                <span class="badge ${o.payment_status === 'Paid' ? 'badge-paid' : 'badge-unpaid'}">${o.payment_status}</span><br>
                <span class="badge ${o.status === 'Delivered' ? 'badge-delivered' : 'badge-pending'}">${o.status}</span>
              </div>
            </div>
            <div class="order-body" id="body-${o.id}">
              <div class="order-detail"><strong>Address:</strong> ${o.customer_address || 'N/A'}</div>
              <div class="order-detail"><strong>Reference:</strong> ${o.payment_reference || 'N/A'}</div>
              <div class="items-list">${itemsHtml}</div>
              <a href="https://wa.me/2348065739757?text=${waMsg}" target="_blank" class="wa-btn">💬 Follow Up on WhatsApp</a>
            </div>
          </div>`;
        }).join('');
      } catch { document.getElementById('ordersList').innerHTML = '<div class="empty"><span class="empty-icon">⚠️</span><p>Failed to load orders.</p></div>'; }
    }

    loadProfile();
    loadOrders();
  </script>
</body>
</html>
