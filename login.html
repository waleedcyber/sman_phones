<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo/logo.png" />
  <title>Sign In — SmanAppleComms</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A84C; --gold-light: #E8C96A; --gold-dim: #8B6914;
      --black: #0A0A0A; --black-2: #111111; --black-3: #1A1A1A; --black-4: #222222;
      --white: #F5F5F0; --white-dim: #AAAAAA;
      --font-display: 'Playfair Display', serif; --font-body: 'Poppins', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--black); color: var(--white); font-family: var(--font-body); font-weight: 300; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }

    .card { background: var(--black-3); border: 1px solid rgba(201,168,76,0.15); border-radius: 14px; max-width: 400px; width: 100%; padding: 36px 28px; animation: popIn 0.4s ease; }
    @keyframes popIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .logo { font-family: var(--font-display); font-size: 20px; color: var(--gold); text-align: center; margin-bottom: 4px; }
    .tagline { font-size: 12px; color: var(--white-dim); text-align: center; margin-bottom: 28px; }
    .page-title { font-family: var(--font-display); font-size: 22px; color: var(--white); margin-bottom: 6px; }
    .page-sub { font-size: 13px; color: var(--white-dim); margin-bottom: 20px; }
    .gold-line { width: 32px; height: 2px; background: var(--gold); margin-bottom: 24px; }

    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); margin-bottom: 7px; font-weight: 500; }
    .form-input { width: 100%; background: var(--black-4); border: 1px solid rgba(201,168,76,0.12); color: var(--white); padding: 13px 14px; border-radius: 4px; font-size: 14px; font-family: var(--font-body); transition: border-color 0.2s; }
    .form-input:focus { outline: none; border-color: var(--gold); }
    .form-input::placeholder { color: rgba(170,170,170,0.4); }

    .forgot-link { display: block; text-align: right; font-size: 12px; color: var(--gold-dim); text-decoration: none; margin-top: -8px; margin-bottom: 16px; transition: color 0.2s; }
    .forgot-link:hover { color: var(--gold); }

    .btn-login { width: 100%; background: var(--gold); color: var(--black); border: none; padding: 15px; border-radius: 4px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--font-body); margin-top: 4px; transition: background 0.2s; }
    .btn-login:hover { background: var(--gold-light); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

    #statusMsg { text-align: center; padding: 11px; border-radius: 6px; font-size: 13px; font-weight: 500; margin-top: 12px; display: none; }
    #statusMsg.success { background: rgba(37,211,102,0.1); color: #25D366; border: 1px solid rgba(37,211,102,0.2); display: block; }
    #statusMsg.error { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); display: block; }

    .divider { display: flex; align-items: center; gap: 10px; margin: 20px 0; }
    .divider-line { flex: 1; height: 1px; background: rgba(255,255,255,0.06); }
    .divider-text { font-size: 11px; color: var(--white-dim); }

    .btn-guest { width: 100%; background: transparent; color: var(--white-dim); border: 1px solid rgba(255,255,255,0.08); padding: 13px; border-radius: 4px; font-size: 13px; cursor: pointer; font-family: var(--font-body); transition: border-color 0.2s, color 0.2s; text-decoration: none; display: block; text-align: center; }
    .btn-guest:hover { border-color: var(--gold-dim); color: var(--white); }

    .register-link { text-align: center; margin-top: 20px; font-size: 13px; color: var(--white-dim); }
    .register-link a { color: var(--gold); text-decoration: none; font-weight: 500; }
    .register-link a:hover { color: var(--gold-light); }

    .back-store { display: block; text-align: center; margin-top: 16px; font-size: 12px; color: var(--white-dim); text-decoration: none; transition: color 0.2s; }
    .back-store:hover { color: var(--gold); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">SmanAppleComms</div>
    <div class="tagline">Premium Verified Phones</div>

    <h2 class="page-title">Welcome Back</h2>
    <p class="page-sub">Sign in to track your orders.</p>
    <div class="gold-line"></div>

    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input class="form-input" type="email" id="email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" type="password" id="password" placeholder="Your password" onkeydown="if(event.key==='Enter')login()" />
    </div>

    <a href="forgot_password.html" class="forgot-link">Forgot password?</a>

    <button class="btn-login" id="loginBtn" onclick="login()">Sign In</button>
    <div id="statusMsg"></div>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">or</div>
      <div class="divider-line"></div>
    </div>

    <a href="products.html" class="btn-guest">Continue Browsing</a>

    <div class="register-link">
      Don't have an account? <a href="register.html">Create one</a>
    </div>

    <a href="index.html" class="back-store">← Back to Store</a>
  </div>

  <script>
    const baseUrl = "https://s-and-s-collection-32bh.onrender.com/api";

    // Redirect if already logged in
    if (localStorage.getItem('userToken')) window.location.href = 'account.html';

    function showMsg(text, type) {
      const el = document.getElementById('statusMsg');
      el.textContent = text; el.className = type;
    }

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email) { showMsg('Please enter your email.', 'error'); return; }
      if (!password) { showMsg('Please enter your password.', 'error'); return; }

      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = 'Signing in...';

      try {
        const res = await fetch(`${baseUrl}/user/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          // Save token and redirect
          localStorage.setItem('userToken', data.access_token);
          showMsg('✅ Welcome back! Redirecting...', 'success');

          // Redirect to account or checkout if they came from there
          const redirect = new URLSearchParams(window.location.search).get('redirect');
          setTimeout(() => window.location.href = redirect || 'account.html', 1000);
        } else {
          showMsg(data.detail || 'Invalid email or password.', 'error');
        }
      } catch {
        showMsg('Network error. Please try again.', 'error');
      } finally {
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
