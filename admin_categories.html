<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo/logo.png" />
  <title>Categories — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A84C; --gold-light: #E8C96A; --gold-dim: #8B6914;
      --black: #0A0A0A; --black-2: #111111; --black-3: #1A1A1A; --black-4: #222222;
      --white: #F5F5F0; --white-dim: #AAAAAA;
      --font-display: 'Playfair Display', serif; --font-body: 'Poppins', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--black); color: var(--white); font-family: var(--font-body); font-weight: 300; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }
    header { background: var(--black-2); border-bottom: 1px solid rgba(201,168,76,0.12); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .header-title { font-family: var(--font-display); font-size: 16px; color: var(--gold); }
    .back-link { color: var(--white-dim); text-decoration: none; font-size: 13px; transition: color 0.2s; }
    .back-link:hover { color: var(--gold); }
    .page { max-width: 680px; margin: 0 auto; padding: 24px 16px 80px; }

    /* Add form */
    .add-card { background: var(--black-3); border: 1px solid rgba(201,168,76,0.12); border-radius: 12px; padding: 20px 18px; margin-bottom: 24px; }
    .add-card h3 { font-family: var(--font-display); font-size: 15px; color: var(--white); margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); margin-bottom: 7px; font-weight: 500; }
    .form-input { width: 100%; background: var(--black-4); border: 1px solid rgba(201,168,76,0.12); color: var(--white); padding: 12px 14px; border-radius: 4px; font-size: 14px; font-family: var(--font-body); transition: border-color 0.2s; }
    .form-input:focus { outline: none; border-color: var(--gold); }
    .form-input::placeholder { color: rgba(170,170,170,0.4); }
    select.form-input option { background: var(--black-3); }
    .btn-add { width: 100%; background: var(--gold); color: var(--black); border: none; padding: 13px; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--font-body); margin-top: 4px; transition: background 0.2s; }
    .btn-add:hover { background: var(--gold-light); }
    #addMsg { text-align: center; font-size: 13px; margin-top: 10px; display: none; font-weight: 500; }
    #addMsg.success { color: #25D366; display: block; }
    #addMsg.error { color: #ef4444; display: block; }

    /* Category list */
    .section-label { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; font-weight: 500; }

    /* Parent block */
    .parent-block { background: var(--black-3); border: 1px solid rgba(201,168,76,0.08); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
    .parent-row { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .parent-icon { font-size: 16px; }
    .parent-name { flex: 1; font-size: 15px; font-weight: 500; color: var(--white); }
    .sub-count { font-size: 11px; background: rgba(201,168,76,0.1); color: var(--gold); padding: 2px 8px; border-radius: 10px; }
    .edit-input { flex: 1; background: var(--black-4); border: 1px solid var(--gold); color: var(--white); padding: 8px 10px; border-radius: 4px; font-size: 14px; font-family: var(--font-body); display: none; }
    .edit-input:focus { outline: none; }
    .btn-icon { background: none; border: none; cursor: pointer; font-size: 16px; padding: 4px 6px; border-radius: 4px; transition: background 0.2s; }
    .btn-icon:hover { background: var(--black-4); }

    /* Children */
    .children-list { padding: 4px 0; }
    .child-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 32px; border-bottom: 1px solid rgba(255,255,255,0.02); }
    .child-row:last-child { border-bottom: none; }
    .child-arrow { color: var(--white-dim); font-size: 12px; flex-shrink: 0; }
    .child-name { flex: 1; font-size: 13px; color: var(--white-dim); }

    .empty-msg { text-align: center; padding: 40px 20px; color: var(--white-dim); font-size: 14px; }

    /* Status msg */
    #globalMsg { text-align: center; font-size: 13px; margin-bottom: 14px; font-weight: 500; display: none; padding: 10px; border-radius: 6px; }
    #globalMsg.success { background: rgba(37,211,102,0.1); color: #25D366; border: 1px solid rgba(37,211,102,0.2); display: block; }
    #globalMsg.error { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); display: block; }
  </style>
</head>
<body>
  <header>
    <div class="header-title">🗂️ Categories</div>
    <a href="admin_home.html" class="back-link">← Dashboard</a>
  </header>

  <div class="page">

    <!-- Add category -->
    <div class="add-card">
      <h3>Add New Category</h3>
      <div class="form-group">
        <label class="form-label">Category Name</label>
        <input class="form-input" type="text" id="newCatName" placeholder="e.g. iPhones, Samsung, Used Phones" />
      </div>
      <div class="form-group">
        <label class="form-label">Parent Category (optional)</label>
        <select class="form-input" id="parentSelect">
          <option value="">None — this is a main category</option>
        </select>
      </div>
      <button class="btn-add" onclick="addCategory()">+ Add Category</button>
      <div id="addMsg"></div>
    </div>

    <div id="globalMsg"></div>
    <div class="section-label">All Categories</div>
    <div id="categoryList"><div class="empty-msg">Loading categories...</div></div>
  </div>

  <script>
    const baseUrl = "https://s-and-s-collection-32bh.onrender.com/api";
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'admin_login.html';
    let allCats = [];

    function showGlobalMsg(text, type) {
      const el = document.getElementById('globalMsg');
      el.textContent = text; el.className = type;
      setTimeout(() => { el.className = ''; el.textContent = ''; }, 3000);
    }

    function populateParentDropdown() {
      const select = document.getElementById('parentSelect');
      const parents = allCats.filter(c => !c.parent_id);
      select.innerHTML = '<option value="">None — this is a main category</option>';
      parents.forEach(p => {
        select.innerHTML += `<option value="${p.id}">${p.name}</option>`;
      });
    }

    function renderCategories() {
      const list = document.getElementById('categoryList');
      const parents = allCats.filter(c => !c.parent_id);
      const children = allCats.filter(c => c.parent_id);

      if (parents.length === 0) {
        list.innerHTML = '<div class="empty-msg">No categories yet. Add one above!</div>';
        return;
      }

      list.innerHTML = parents.map(p => {
        const kids = children.filter(c => c.parent_id === p.id);
        return `
        <div class="parent-block">
          <div class="parent-row">
            <span class="parent-icon">📁</span>
            <span class="parent-name" id="name-${p.id}">${p.name}</span>
            <input class="edit-input" id="edit-${p.id}" value="${p.name}" />
            ${kids.length > 0 ? `<span class="sub-count">${kids.length} sub</span>` : ''}
            <button class="btn-icon" id="editbtn-${p.id}" onclick="startEdit(${p.id})" title="Edit">✏️</button>
            <button class="btn-icon" id="savebtn-${p.id}" onclick="saveEdit(${p.id}, null)" title="Save" style="display:none;">✅</button>
            <button class="btn-icon" id="cancelbtn-${p.id}" onclick="cancelEdit(${p.id})" title="Cancel" style="display:none;">❌</button>
            <button class="btn-icon" onclick="deleteCategory(${p.id})" title="Delete">🗑️</button>
          </div>
          ${kids.length > 0 ? `
          <div class="children-list">
            ${kids.map(k => `
            <div class="child-row">
              <span class="child-arrow">↳</span>
              <span class="child-name" id="name-${k.id}">${k.name}</span>
              <input class="edit-input" id="edit-${k.id}" value="${k.name}" />
              <button class="btn-icon" id="editbtn-${k.id}" onclick="startEdit(${k.id})" title="Edit">✏️</button>
              <button class="btn-icon" id="savebtn-${k.id}" onclick="saveEdit(${k.id}, ${p.id})" title="Save" style="display:none;">✅</button>
              <button class="btn-icon" id="cancelbtn-${k.id}" onclick="cancelEdit(${k.id})" title="Cancel" style="display:none;">❌</button>
              <button class="btn-icon" onclick="deleteCategory(${k.id})" title="Delete">🗑️</button>
            </div>`).join('')}
          </div>` : ''}
        </div>`;
      }).join('');
    }

    function startEdit(id) {
      document.getElementById(`name-${id}`).style.display = 'none';
      document.getElementById(`edit-${id}`).style.display = 'block';
      document.getElementById(`editbtn-${id}`).style.display = 'none';
      document.getElementById(`savebtn-${id}`).style.display = 'inline-block';
      document.getElementById(`cancelbtn-${id}`).style.display = 'inline-block';
      document.getElementById(`edit-${id}`).focus();
    }

    function cancelEdit(id) {
      document.getElementById(`name-${id}`).style.display = 'inline';
      document.getElementById(`edit-${id}`).style.display = 'none';
      document.getElementById(`editbtn-${id}`).style.display = 'inline-block';
      document.getElementById(`savebtn-${id}`).style.display = 'none';
      document.getElementById(`cancelbtn-${id}`).style.display = 'none';
    }

    async function saveEdit(id, parentId) {
      const name = document.getElementById(`edit-${id}`).value.trim();
      if (!name) return;
      try {
        const body = { name };
        if (parentId) body.parent_id = parentId;
        const res = await fetch(`${baseUrl}/admin/categories/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify(body)
        });
        if (res.ok) { showGlobalMsg('✅ Category updated!', 'success'); loadCategories(); }
        else { showGlobalMsg('Failed to update.', 'error'); }
      } catch { showGlobalMsg('Network error.', 'error'); }
    }

    async function deleteCategory(id) {
      if (!confirm('Delete this category? Products in this category will lose it.')) return;
      try {
        const res = await fetch(`${baseUrl}/admin/categories/${id}`, {
          method: 'DELETE', headers: { Authorization: `Bearer ${token}` }
        });
        if (res.ok) { showGlobalMsg('✅ Category deleted!', 'success'); loadCategories(); }
        else { showGlobalMsg('Failed to delete.', 'error'); }
      } catch { showGlobalMsg('Network error.', 'error'); }
    }

    async function addCategory() {
      const name = document.getElementById('newCatName').value.trim();
      const parentId = document.getElementById('parentSelect').value;
      const msg = document.getElementById('addMsg');
      if (!name) { msg.textContent = 'Please enter a category name.'; msg.className = 'error'; return; }
      msg.className = ''; msg.textContent = '';
      try {
        const body = { name };
        if (parentId) body.parent_id = parseInt(parentId);
        const res = await fetch(`${baseUrl}/admin/categories`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify(body)
        });
        if (res.ok) {
          msg.textContent = '✅ Category added!'; msg.className = 'success';
          document.getElementById('newCatName').value = '';
          document.getElementById('parentSelect').value = '';
          loadCategories();
          setTimeout(() => { msg.className = ''; msg.textContent = ''; }, 3000);
        } else {
          const d = await res.json().catch(() => ({}));
          msg.textContent = d.detail || 'Failed to add.'; msg.className = 'error';
        }
      } catch { msg.textContent = 'Network error.'; msg.className = 'error'; }
    }

    async function loadCategories() {
      try {
        const res = await fetch(`${baseUrl}/admin/categories`, { headers: { Authorization: `Bearer ${token}` } });
        if (res.status === 401) { window.location.href = 'admin_login.html'; return; }
        allCats = res.ok ? await res.json() : [];
        renderCategories();
        populateParentDropdown();
      } catch { document.getElementById('categoryList').innerHTML = '<div class="empty-msg">Failed to load categories.</div>'; }
    }

    loadCategories();
  </script>
</body>
</html>
