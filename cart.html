<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo/logo.png" />
  <title>Cart — Dr Apple</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #1A56DB; --blue-dark: #1040B0; --blue-light: #EEF2FF;
      --black: #0D0D0D; --gray: #4B5563; --gray-light: #F3F4F6;
      --white: #FFFFFF; --border: #E5E7EB;
      --font-display: 'Playfair Display', serif; --font-body: 'Poppins', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--gray-light); color: var(--black); font-family: var(--font-body); font-weight: 300; min-height: 100vh; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: var(--blue); border-radius: 2px; }

    nav { position: sticky; top: 0; z-index: 100; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.98); border-bottom: 1px solid var(--border); box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
    .nav-logo { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--black); text-decoration: none; }
    .nav-logo span { color: var(--blue); }
    .nav-back { color: var(--gray); text-decoration: none; font-size: 13px; transition: color 0.2s; display: flex; align-items: center; gap: 4px; }
    .nav-back:hover { color: var(--blue); }

    .page-wrap { max-width: 680px; margin: 0 auto; padding: 28px 16px 100px; }
    .page-title { font-family: var(--font-display); font-size: 26px; color: var(--black); margin-bottom: 4px; }
    .page-sub { font-size: 13px; color: var(--gray); margin-bottom: 6px; }
    .blue-line { width: 32px; height: 3px; background: var(--blue); border-radius: 2px; margin-bottom: 24px; }

    /* Empty state */
    .empty-state { text-align: center; padding: 70px 20px; background: white; border-radius: 14px; border: 1.5px solid var(--border); }
    .empty-icon { font-size: 56px; margin-bottom: 18px; display: block; }
    .empty-state h2 { font-family: var(--font-display); font-size: 22px; color: var(--black); margin-bottom: 8px; }
    .empty-state p { font-size: 14px; color: var(--gray); margin-bottom: 24px; }
    .btn-browse { display: inline-block; background: var(--blue); color: white; padding: 13px 28px; border-radius: 6px; font-size: 14px; font-weight: 600; text-decoration: none; transition: background 0.2s; }
    .btn-browse:hover { background: var(--blue-dark); }

    /* Cart items */
    .cart-item { background: white; border: 1.5px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 14px; transition: border-color 0.2s, box-shadow 0.2s; }
    .cart-item:hover { border-color: var(--blue); box-shadow: 0 2px 10px rgba(26,86,219,0.08); }
    .cart-item-img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: var(--gray-light); }
    .cart-item-details { flex: 1; min-width: 0; }
    .cart-item-type { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--blue); font-weight: 500; margin-bottom: 3px; }
    .cart-item-name { font-family: var(--font-display); font-size: 14px; color: var(--black); margin-bottom: 3px; line-height: 1.3; }
    .cart-item-meta { font-size: 11px; color: var(--gray); margin-bottom: 10px; }
    .cart-item-price { font-size: 15px; font-weight: 600; color: var(--blue); margin-bottom: 8px; }
    .qty-row { display: flex; align-items: center; gap: 10px; }
    .qty-btn { width: 30px; height: 30px; border-radius: 50%; background: var(--gray-light); border: 1.5px solid var(--border); color: var(--black); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; line-height: 1; }
    .qty-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }
    .qty-val { font-size: 15px; font-weight: 600; min-width: 20px; text-align: center; color: var(--black); }
    .subtotal { font-size: 11px; color: var(--gray); }
    .remove-btn { background: none; border: none; color: #D1D5DB; font-size: 20px; cursor: pointer; flex-shrink: 0; transition: color 0.2s; padding: 4px; align-self: flex-start; }
    .remove-btn:hover { color: #EF4444; }

    /* Summary */
    .summary-card { background: white; border: 1.5px solid var(--border); border-radius: 14px; padding: 22px; margin-top: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .summary-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--gray); padding: 8px 0; border-bottom: 1px solid var(--border); }
    .summary-row:last-of-type { border-bottom: none; }
    .summary-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 600; color: var(--black); padding: 16px 0 20px; border-top: 2px solid var(--border); margin-top: 6px; }
    .summary-total span:last-child { color: var(--blue); }

    .btn-checkout { display: block; width: 100%; background: var(--blue); color: white; border: none; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: var(--font-body); text-align: center; text-decoration: none; transition: background 0.2s; margin-bottom: 10px; }
    .btn-checkout:hover { background: var(--blue-dark); }

    .btn-wa-cart { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: #25D366; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--font-body); text-decoration: none; transition: opacity 0.2s; margin-bottom: 10px; }
    .btn-wa-cart:hover { opacity: 0.9; }

    .btn-clear { display: block; width: 100%; background: white; color: #EF4444; border: 1.5px solid #FECACA; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: var(--font-body); transition: all 0.2s; }
    .btn-clear:hover { background: #FEF2F2; border-color: #EF4444; }

    .or-divider { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
    .or-line { flex: 1; height: 1px; background: var(--border); }
    .or-text { font-size: 11px; color: var(--gray); }

    .float-wa { position: fixed; bottom: 24px; right: 24px; z-index: 999; background: #25D366; color: white; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 4px 20px rgba(37,211,102,0.35); text-decoration: none; transition: transform 0.2s; }
    .float-wa:hover { transform: scale(1.1); }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">Dr <span>Apple</span></a>
    <a href="products.html" class="nav-back">← Continue Shopping</a>
  </nav>

  <div class="page-wrap">
    <h1 class="page-title">Your Cart</h1>
    <p class="page-sub" id="cartSubtitle"></p>
    <div class="blue-line"></div>
    <div id="cartContent"></div>
  </div>

  <a href="https://wa.me/2348137843328" target="_blank" class="float-wa">💬</a>

  <script>
    const WHATSAPP = "2348137843328";

    function renderCart() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const container = document.getElementById('cartContent');
      const subtitle = document.getElementById('cartSubtitle');

      if (cart.length === 0) {
        subtitle.textContent = '';
        container.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">🛒</span>
            <h2>Your cart is empty</h2>
            <p>Browse our phones, laptops and accessories and add something you love.</p>
            <a href="products.html" class="btn-browse">Browse Products</a>
          </div>`;
        return;
      }

      let total = 0;
      let totalItems = 0;
      let itemsHtml = '';

      cart.forEach((item, i) => {
        const qty = item.quantity || 1;
        const subtotal = item.price * qty;
        total += subtotal;
        totalItems += qty;

        itemsHtml += `
          <div class="cart-item">
            <img class="cart-item-img" src="${item.image_url || 'https://via.placeholder.com/72x72/F3F4F6/1A56DB?text=📱'}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/72x72/F3F4F6/1A56DB?text=📱'" />
            <div class="cart-item-details">
              ${item.condition ? `<div class="cart-item-type">${item.condition}</div>` : ''}
              <div class="cart-item-name">${item.name}</div>
              <div class="cart-item-meta">${[item.brand, item.storage, item.color].filter(Boolean).join(' · ')}</div>
              <div class="cart-item-price">₦${Number(item.price).toLocaleString()}</div>
              <div class="qty-row">
                <button class="qty-btn" onclick="changeQty(${i}, -1)">−</button>
                <span class="qty-val">${qty}</span>
                <button class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
                <span class="subtotal">= ₦${subtotal.toLocaleString('en-NG', {minimumFractionDigits:2})}</span>
              </div>
            </div>
            <button class="remove-btn" onclick="removeItem(${i})" title="Remove">🗑</button>
          </div>`;
      });

      subtitle.textContent = `${totalItems} item${totalItems !== 1 ? 's' : ''} in your cart`;

      // Build WhatsApp message
      const waItems = cart.map(i => `• ${i.name}${i.storage ? ` (${i.storage})` : ''} × ${i.quantity || 1} — ₦${(i.price * (i.quantity || 1)).toLocaleString()}`).join('\n');
      const waMsg = encodeURIComponent(`Hello Dr Apple! 👋 I'd like to order the following:\n\n${waItems}\n\n*Total: ₦${total.toLocaleString()}*\n\nPlease confirm availability and payment details. Thank you!`);

      container.innerHTML = `
        ${itemsHtml}
        <div class="summary-card">
          <div class="summary-row"><span>Items (${totalItems})</span><span>₦${total.toLocaleString()}</span></div>
          <div class="summary-row"><span>Delivery</span><span style="color:#25D366;">Arranged after order</span></div>
          <div class="summary-total"><span>Total</span><span>₦${total.toLocaleString('en-NG', {minimumFractionDigits:2})}</span></div>
          <a href="checkout.html" class="btn-checkout">Proceed to Checkout →</a>
          <div class="or-divider"><div class="or-line"></div><span class="or-text">or order directly</span><div class="or-line"></div></div>
          <a href="https://wa.me/${WHATSAPP}?text=${waMsg}" target="_blank" class="btn-wa-cart">💬 Send Cart to WhatsApp</a>
          <button class="btn-clear" onclick="clearCart()">🗑 Clear Cart</button>
        </div>`;
    }

    function changeQty(index, delta) {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart[index].quantity = (cart[index].quantity || 1) + delta;
      if (cart[index].quantity <= 0) cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }

    function removeItem(index) {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }

    function clearCart() {
      if (confirm('Clear your entire cart?')) {
        localStorage.removeItem('cart');
        renderCart();
      }
    }

    renderCart();
  </script>
</body>
</html>
