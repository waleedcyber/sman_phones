<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo/logo.png" />
  <title>Cart — SmanAppleComms</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A84C; --gold-light: #E8C96A; --gold-dim: #8B6914;
      --black: #0A0A0A; --black-2: #111111; --black-3: #1A1A1A; --black-4: #222222;
      --white: #F5F5F0; --white-dim: #AAAAAA;
      --font-display: 'Playfair Display', serif; --font-body: 'Poppins', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--black); color: var(--white); font-family: var(--font-body); font-weight: 300; min-height: 100vh; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }

    nav { position: sticky; top: 0; z-index: 100; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; background: rgba(10,10,10,0.98); border-bottom: 1px solid rgba(201,168,76,0.12); }
    .nav-logo { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--gold); text-decoration: none; }
    .nav-back { color: var(--white-dim); text-decoration: none; font-size: 13px; transition: color 0.2s; }
    .nav-back:hover { color: var(--gold); }

    .page-wrap { max-width: 700px; margin: 0 auto; padding: 32px 16px 100px; }

    .page-title { font-family: var(--font-display); font-size: 28px; color: var(--white); margin-bottom: 6px; }
    .gold-line { width: 36px; height: 2px; background: var(--gold); margin: 12px 0 28px; }

    /* Empty state */
    .empty-state { text-align: center; padding: 80px 20px; }
    .empty-icon { font-size: 56px; margin-bottom: 20px; display: block; }
    .empty-state h2 { font-family: var(--font-display); font-size: 22px; color: var(--white); margin-bottom: 10px; }
    .empty-state p { font-size: 14px; color: var(--white-dim); margin-bottom: 28px; }
    .btn-browse { display: inline-block; background: var(--gold); color: var(--black); padding: 13px 28px; border-radius: 4px; font-size: 13px; font-weight: 600; text-decoration: none; letter-spacing: 1px; text-transform: uppercase; transition: background 0.2s; }
    .btn-browse:hover { background: var(--gold-light); }

    /* Cart items */
    .cart-item { display: flex; gap: 14px; background: var(--black-3); border: 1px solid rgba(201,168,76,0.08); border-radius: 10px; padding: 14px; margin-bottom: 12px; align-items: flex-start; transition: border-color 0.2s; }
    .cart-item:hover { border-color: rgba(201,168,76,0.2); }
    .cart-item-img { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: var(--black-4); }
    .cart-item-details { flex: 1; min-width: 0; }
    .cart-item-condition { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); font-weight: 500; margin-bottom: 3px; }
    .cart-item-name { font-family: var(--font-display); font-size: 14px; color: var(--white); margin-bottom: 4px; line-height: 1.3; }
    .cart-item-meta { font-size: 11px; color: var(--white-dim); margin-bottom: 10px; }
    .cart-item-price { font-size: 15px; font-weight: 600; color: var(--gold); }
    .qty-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .qty-btn { width: 28px; height: 28px; border-radius: 50%; background: var(--black-4); border: 1px solid rgba(201,168,76,0.2); color: var(--white); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color 0.2s, background 0.2s; line-height: 1; }
    .qty-btn:hover { border-color: var(--gold); background: var(--black-3); }
    .qty-val { font-size: 14px; font-weight: 500; min-width: 20px; text-align: center; }
    .remove-btn { background: none; border: none; color: rgba(239,68,68,0.5); font-size: 18px; cursor: pointer; padding: 4px; margin-left: auto; transition: color 0.2s; flex-shrink: 0; }
    .remove-btn:hover { color: #ef4444; }
    .subtotal { font-size: 11px; color: var(--white-dim); margin-top: 4px; }

    /* Summary */
    .summary-card { background: var(--black-3); border: 1px solid rgba(201,168,76,0.15); border-radius: 10px; padding: 20px; margin-top: 20px; }
    .summary-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--white-dim); padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .summary-row:last-of-type { border-bottom: none; }
    .summary-total { display: flex; justify-content: space-between; padding: 16px 0 20px; font-size: 18px; font-weight: 600; color: var(--white); }
    .summary-total span:last-child { color: var(--gold); }
    .btn-checkout { display: block; width: 100%; background: var(--gold); color: var(--black); border: none; padding: 16px; border-radius: 4px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--font-body); letter-spacing: 0.5px; transition: background 0.2s; text-align: center; text-decoration: none; }
    .btn-checkout:hover { background: var(--gold-light); }
    .btn-clear { display: block; width: 100%; background: transparent; color: var(--white-dim); border: 1px solid rgba(255,255,255,0.08); padding: 12px; border-radius: 4px; font-size: 13px; cursor: pointer; font-family: var(--font-body); margin-top: 10px; transition: border-color 0.2s, color 0.2s; }
    .btn-clear:hover { border-color: #ef4444; color: #ef4444; }

    /* WA float */
    .float-wa { position: fixed; bottom: 24px; right: 24px; z-index: 999; background: #25D366; color: white; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 4px 20px rgba(37,211,102,0.35); text-decoration: none; transition: transform 0.2s; }
    .float-wa:hover { transform: scale(1.1); }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">SmanAppleComms</a>
    <a href="products.html" class="nav-back">← Continue Shopping</a>
  </nav>

  <div class="page-wrap">
    <h1 class="page-title">Your Cart</h1>
    <div class="gold-line"></div>
    <div id="cartContent"></div>
  </div>

  <a href="https://wa.me/2348065739757" target="_blank" class="float-wa">💬</a>

  <script>
    function renderCart() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const container = document.getElementById('cartContent');

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">🛒</span>
            <h2>Your cart is empty</h2>
            <p>Browse our phones and add something you love.</p>
            <a href="products.html" class="btn-browse">Browse Phones</a>
          </div>`;
        return;
      }

      let total = 0;
      let totalItems = 0;
      let itemsHtml = '';

      cart.forEach((item, i) => {
        const qty = item.quantity || 1;
        const subtotal = item.price * qty;
        total += subtotal;
        totalItems += qty;

        itemsHtml += `
          <div class="cart-item">
            <img class="cart-item-img" src="${item.image_url || 'https://via.placeholder.com/72x72/1A1A1A/C9A84C?text=📱'}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/72x72/1A1A1A/C9A84C?text=📱'" />
            <div class="cart-item-details">
              ${item.condition ? `<div class="cart-item-condition">${item.condition}</div>` : ''}
              <div class="cart-item-name">${item.name}</div>
              <div class="cart-item-meta">${[item.brand, item.storage, item.color].filter(Boolean).join(' · ')}</div>
              <div class="cart-item-price">₦${Number(item.price).toLocaleString()}</div>
              <div class="qty-row">
                <button class="qty-btn" onclick="changeQty(${i}, -1)">−</button>
                <span class="qty-val">${qty}</span>
                <button class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
                <span class="subtotal">= ₦${subtotal.toLocaleString()}</span>
              </div>
            </div>
            <button class="remove-btn" onclick="removeItem(${i})" title="Remove">🗑</button>
          </div>`;
      });

      container.innerHTML = `
        ${itemsHtml}
        <div class="summary-card">
          <div class="summary-row"><span>Items (${totalItems})</span><span>₦${total.toLocaleString()}</span></div>
          <div class="summary-row"><span>Delivery</span><span style="color:var(--gold);">Arranged after order</span></div>
          <div class="summary-total"><span>Total</span><span>₦${total.toLocaleString('en-NG', {minimumFractionDigits:2})}</span></div>
          <a href="checkout.html" class="btn-checkout">Proceed to Checkout →</a>
          <button class="btn-clear" onclick="clearCart()">🗑 Clear Cart</button>
        </div>`;
    }

    function changeQty(index, delta) {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart[index].quantity = (cart[index].quantity || 1) + delta;
      if (cart[index].quantity <= 0) cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }

    function removeItem(index) {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }

    function clearCart() {
      if (confirm('Clear your entire cart?')) {
        localStorage.removeItem('cart');
        renderCart();
      }
    }

    renderCart();
  </script>
</body>
</html>
