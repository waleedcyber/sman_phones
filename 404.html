<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Dr Apple</title>
  <link rel="icon" type="image/png" href="/logo/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #EEF2FF 0%, #F0F4FF 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      text-align: center;
    }

    .container {
      max-width: 460px;
      width: 100%;
      animation: popIn 0.5s ease;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .big-number {
      font-family: 'Playfair Display', serif;
      font-size: 7em;
      font-weight: 700;
      color: #1A56DB;
      line-height: 1;
      margin-bottom: 10px;
      text-shadow: 0 4px 15px rgba(26, 86, 219, 0.2);
    }

    .emoji {
      font-size: 3em;
      margin-bottom: 15px;
      display: block;
      animation: wobble 1.5s infinite ease-in-out;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(-5deg); }
      50%       { transform: rotate(5deg); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4em;
      color: #0D0D0D;
      margin-bottom: 10px;
    }

    p {
      color: #6B7280;
      font-size: 0.92em;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      padding: 13px 20px;
      border-radius: 8px;
      font-size: 0.95em;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }

    .btn-primary {
      background: #1A56DB;
      color: white;
    }

    .btn-outline {
      background: white;
      color: #1A56DB;
      border: 2px solid #1A56DB;
    }

    .footer-note {
      margin-top: 28px;
      font-size: 0.78em;
      color: #9CA3AF;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="big-number">404</div>
    <span class="emoji">💻</span>
    <h1>Oops! Page not found</h1>
    <p>
      Looks like this page is out of stock.<br>
      Don't worry — there's plenty more to explore!
    </p>

    <div class="btn-group">
      <a href="products.html" class="btn btn-primary">📱 Browse Products</a>
      <a href="index.html" class="btn btn-outline">🏠 Go Back Home</a>
    </div>

    <p class="footer-note">Dr Apple — Zoo Road, MYCA 7 Plaza, Kano &mdash; Open 24hrs 🔵</p>
  </div>

</body>
</html>
